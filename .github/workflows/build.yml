name: 构建 Linux 定制内核

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核源码仓库地址'
        required: true
        default: 'https://github.com/Geeeeeker/linux'
      kernel_ref:
        description: '分支、标签或提交哈希'
        required: true
        default: 'master'
      kernel_version:
        description: '自定义内核版本号（用于包名）'
        required: true
        default: '7.0.0-custom'

env:
  KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'https://github.com/Geeeeeker/linux' }}
  KERNEL_REF: ${{ github.event.inputs.kernel_ref || 'master' }}
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '7.0.0-custom' }}
  ARTIFACT_NAME: linux-kernel-${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc dwarves rsync cpio wget xz-utils git fakeroot dpkg-dev \
            libtool autoconf automake pkg-config libglib2.0-dev libudev-dev \
            libusb-1.0-0-dev libxml2-dev \
            debhelper libdw-dev

      - name: 打印编译环境信息 (CPU/GPU/NPU)
        run: |
          echo "=== 编译环境硬件信息 ==="
          echo "CPU 信息:"
          lscpu | grep -E "Model name|Architecture|CPU\(s\)|Thread|Core|Socket"
          echo ""
          echo "GPU 信息 (如果有):"
          if command -v lspci &> /dev/null; then
            lspci | grep -E "VGA|3D|Display" || echo "未检测到 PCI 显卡设备"
          else
            echo "lspci 命令不可用"
          fi
          echo ""
          echo "NPU 信息 (如果有):"
          if command -v lspci &> /dev/null; then
            lspci | grep -i "neural\|npu\|ai" || echo "未检测到 NPU 设备"
          else
            echo "lspci 命令不可用"
          fi
          echo ""
          echo "内存信息:"
          free -h
          echo ""
          echo "操作系统信息:"
          lsb_release -a 2>/dev/null || cat /etc/os-release

      - name: 克隆 Linux 内核源码
        run: |
          echo "克隆仓库：$KERNEL_REPO，引用：$KERNEL_REF"
          git clone --depth 1 --branch $KERNEL_REF $KERNEL_REPO linux-src
          cd linux-src
          echo "KERNEL_SRC=$(pwd)" >> $GITHUB_ENV

      - name: 集成 CH343P 驱动
        run: |
          cd $KERNEL_SRC
          if ! grep -q "config USB_SERIAL_CH343" drivers/usb/serial/Kconfig; then
            echo "" >> drivers/usb/serial/Kconfig
            echo "config USB_SERIAL_CH343" >> drivers/usb/serial/Kconfig
            echo "	tristate \"CH343 USB serial driver\"" >> drivers/usb/serial/Kconfig
            echo "	help" >> drivers/usb/serial/Kconfig
            echo "	  Say Y here to include support for CH343 USB to serial adapter." >> drivers/usb/serial/Kconfig
          fi
          if ! grep -q "obj-\$(CONFIG_USB_SERIAL_CH343)" drivers/usb/serial/Makefile; then
            echo "obj-\$(CONFIG_USB_SERIAL_CH343) += ch343.o" >> drivers/usb/serial/Makefile
          fi
          if [ ! -f drivers/usb/serial/ch343.c ]; then
            wget https://raw.githubusercontent.com/WCHSoftGroup/ch343ser_linux/master/driver/ch343.c -O drivers/usb/serial/ch343.c
          fi
          if [ ! -f drivers/usb/serial/ch343.h ]; then
            wget https://raw.githubusercontent.com/WCHSoftGroup/ch343ser_linux/master/driver/ch343.h -O drivers/usb/serial/ch343.h
          fi

      - name: 生成主线默认配置
        run: |
          cd $KERNEL_SRC
          make defconfig

      - name: 创建自定义内核配置片段
        run: |
          cd $KERNEL_SRC
          cat > custom-features.cfg << 'EOF'
          # ========== 基础系统支持 ==========
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_SYSVIPC_COMPAT=y
          CONFIG_EPOLL=y
          CONFIG_EVENTFD=y
          CONFIG_SIGNALFD=y
          CONFIG_INOTIFY_USER=y
          CONFIG_SHMEM=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          # ========== LXC 容器所需 ==========
          CONFIG_NAMESPACES=y
          CONFIG_CGROUPS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_BLK_CGROUP=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CGROUP_NET_CLASSID=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_RT_GROUP_SCHED=y
          CONFIG_CHECKPOINT_RESTORE=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y

          # ========== USB Gadget / UDC ==========
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_DWC3=y
          CONFIG_USB_DWC3_HOST=y
          CONFIG_USB_DWC3_GADGET=y
          CONFIG_USB_DWC3_DUAL_ROLE=y

          # ========== USB Gadget 功能 ==========
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_F_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_SERIAL=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_F_LB_SS=y
          CONFIG_USB_MASS_STORAGE=y

          # ========== USB 转串口 ==========
          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_GENERIC=y
          CONFIG_USB_SERIAL_CH341=y
          CONFIG_USB_SERIAL_CH343=m

          # ========== USB/IP ==========
          CONFIG_USBIP_CORE=y
          CONFIG_USBIP_VHCI_HCD=y
          CONFIG_USBIP_HOST=y
          CONFIG_USBIP_VHCI_HC_PORTS=8
          CONFIG_USBIP_DEBUG=n

          # ========== VHD 启动支持 ==========
          CONFIG_BLK_DEV_LOOP=y
          CONFIG_NTFS3_FS=y
          CONFIG_NTFS3_LZX_XPRESS=y
          CONFIG_NTFS_FS=n

          # ========== 文件系统支持 ==========
          CONFIG_BTRFS_FS=m
          CONFIG_BTRFS_FS_POSIX_ACL=y

          # ========== UVC、ZSTD、KVM、VFIO ==========
          CONFIG_USB_VIDEO_CLASS=y
          CONFIG_ZSTD_COMPRESS=y
          CONFIG_ZSTD_DECOMPRESS=y
          CONFIG_KVM=y
          CONFIG_KVM_INTEL=y
          CONFIG_VFIO=y
          CONFIG_VFIO_PCI=y
          CONFIG_VFIO_IOMMU_TYPE1=y
          CONFIG_VFIO_MDEV=y
          CONFIG_DRM_I915_GVT=y
          CONFIG_DRM_I915_GVT_KVMGT=y

          # ========== Docker & Podman 完整支持 ==========
          CONFIG_OVERLAY_FS=m
          CONFIG_FUSE_FS=m
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_TUN=m
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
          CONFIG_IP_NF_FILTER=m
          CONFIG_IP_NF_NAT=m
          CONFIG_CGROUP_BPF=y

          # ========== 无线网卡支持 (RTL8xxxU) ==========
          CONFIG_RTL8XXXU=m
          CONFIG_RTL8XXXU_UNTESTED=y

          # ========== V4L2 / Media 框架完整支持 (Facetime HD 依赖) ==========
          CONFIG_MEDIA_SUPPORT=y
          CONFIG_MEDIA_CAMERA_SUPPORT=y
          CONFIG_MEDIA_CONTROLLER=y
          CONFIG_VIDEO_DEV=y
          CONFIG_VIDEO_V4L2=y
          CONFIG_VIDEOBUF2_CORE=y
          CONFIG_VIDEOBUF2_V4L2=y
          CONFIG_VIDEOBUF2_MEMOPS=y
          CONFIG_VIDEOBUF2_VMALLOC=y
          CONFIG_VIDEOBUF2_DMA_SG=y
          CONFIG_V4L_PLATFORM_DRIVERS=y
          CONFIG_V4L_MEM2MEM_DRIVERS=y

          # ========== Apple Mac 设备驱动支持 ==========
          # 1. 雷电（Thunderbolt）/ USB4 支持
          CONFIG_USB4=m

          # 2. Apple 触控板与鼠标
          CONFIG_MOUSE_BCM5974=y
          CONFIG_HID_MAGICMOUSE=y

          # 3. Apple 键盘与驱动框架
          CONFIG_MACINTOSH_DRIVERS=y
          CONFIG_HID_APPLE=y

          # 4. 新款 Mac 的 SPI 键盘和触控板驱动
          CONFIG_KEYBOARD_APPLESPI=y

          # 5. Apple SMC (系统管理控制器)
          CONFIG_SENSORS_APPLESMC=y

          # ========== 杜比音频支持 (HDMI/DP 音频) ==========
          CONFIG_SND_HDA_INTEL=y
          CONFIG_SND_HDA_CODEC_HDMI=y
          CONFIG_SND_HDA_CODEC_DOLBY=y
          CONFIG_SND_HDA_CODEC_CIRRUS=y
          CONFIG_SND_HDA_CODEC_CS8409=y

          # ========== 其他推荐功能 ==========
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          EOF

      - name: 合并自定义配置并生成最终配置
        run: |
          cd $KERNEL_SRC
          scripts/kconfig/merge_config.sh -m .config custom-features.cfg
          make olddefconfig

      - name: 显示关键配置状态（用于验证）
        run: |
          cd $KERNEL_SRC
          echo "=== 用户指定基础配置 ==="
          grep -E "CONFIG_SYSVIPC|CONFIG_EPOLL|CONFIG_EVENTFD|CONFIG_TMPFS" .config | head -10 || true
          echo "=== USB Gadget / UDC 配置 ==="
          grep -E "CONFIG_USB_GADGET|CONFIG_USB_CONFIGFS|CONFIG_USB_LIBCOMPOSITE|CONFIG_USB_DWC3" .config | head -10 || true
          echo "=== USB 转串口 (CH343P) ==="
          grep "CONFIG_USB_SERIAL_CH343" .config || true
          echo "=== USB/IP ==="
          grep "CONFIG_USBIP" .config || true
          echo "=== NTFS3 / VHD 支持 ==="
          grep -E "CONFIG_NTFS3|CONFIG_BLK_DEV_LOOP" .config || true
          echo "=== Btrfs 文件系统 ==="
          grep "CONFIG_BTRFS_FS" .config || true
          echo "=== RTL8xxxU 无线网卡 ==="
          grep "CONFIG_RTL8XXXU" .config || true
          echo "=== UVC, ZSTD, KVM, VFIO 等 ==="
          grep -E "CONFIG_USB_VIDEO_CLASS|CONFIG_ZSTD|CONFIG_KVM|CONFIG_VFIO|CONFIG_DRM_I915_GVT" .config || true
          echo "=== Docker / Podman 支持 ==="
          grep -E "CONFIG_OVERLAY_FS|CONFIG_FUSE_FS|CONFIG_SECCOMP|CONFIG_TUN" .config || true
          echo "=== V4L2 / Media 框架 (Facetime HD 依赖) ==="
          grep -E "CONFIG_MEDIA_SUPPORT|CONFIG_VIDEO_DEV|CONFIG_VIDEO_V4L2|CONFIG_VIDEOBUF2" .config || true
          echo "=== Apple 设备驱动 ==="
          grep -E "CONFIG_USB4|CONFIG_MOUSE_BCM5974|CONFIG_HID_MAGICMOUSE|CONFIG_MACINTOSH_DRIVERS|CONFIG_HID_APPLE|CONFIG_KEYBOARD_APPLESPI|CONFIG_SENSORS_APPLESMC" .config || true
          echo "=== 杜比音频支持 ==="
          grep -E "CONFIG_SND_HDA_CODEC_DOLBY|CONFIG_SND_HDA_CODEC_HDMI|CONFIG_SND_HDA_CODEC_CS8409" .config || true

      - name: 编译内核（生成 deb 包）
        run: |
          cd $KERNEL_SRC
          make -j$(nproc) deb-pkg LOCALVERSION=-${KERNEL_VERSION}

      # 由于 Facetime HD 模块与当前内核符号不兼容，暂时注释掉以避免构建失败。
      # - name: 编译 Facetime HD 摄像头驱动 (外部模块)
      #   run: |
      #     cd $KERNEL_SRC
      #     git clone https://github.com/patjak/facetimehd.git
      #     cd facetimehd
      #     make -C $KERNEL_SRC M=$PWD modules
      #     sudo make -C $KERNEL_SRC M=$PWD modules_install
      #     mkdir -p $GITHUB_WORKSPACE/artifacts/facetimehd
      #     find . -name "*.ko" -exec cp --parents {} $GITHUB_WORKSPACE/artifacts/facetimehd/ \;

      - name: 编译 USB/IP 用户空间工具
        run: |
          cd $KERNEL_SRC/tools/usb/usbip
          echo "=== 开始编译 USB/IP 工具 ==="
          ./autogen.sh
          # 禁用将警告视为错误，避免因格式截断警告导致编译失败
          CFLAGS="-Wno-error" ./configure --prefix=/usr/local
          make -j$(nproc)
          mkdir -p /tmp/usbip-tools/usr/local/bin
          mkdir -p /tmp/usbip-tools/usr/local/lib
          mkdir -p /tmp/usbip-tools/usr/local/sbin
          make install DESTDIR=/tmp/usbip-tools
          # 确保动态库被复制
          find /tmp/usbip-tools -name "*.so*" -exec cp -P {} /tmp/usbip-tools/usr/local/lib/ \; 2>/dev/null || true
          cat > /tmp/usbip-tools/install.sh << 'EOF'
          #!/bin/bash
          echo "安装 USB/IP 工具..."
          cp -r usr/local/bin/* /usr/local/bin/ 2>/dev/null || true
          cp -r usr/local/sbin/* /usr/local/sbin/ 2>/dev/null || true
          cp -r usr/local/lib/* /usr/local/lib/ 2>/dev/null || true
          ldconfig
          echo "USB/IP 工具安装完成！"
          EOF
          chmod +x /tmp/usbip-tools/install.sh
          # 打包 USB/IP 工具到 /tmp
          cd /tmp
          tar -czf usbip-tools-linux-${KERNEL_VERSION}.tar.gz usbip-tools/
          echo "=== USB/IP 工具编译并打包完成 ==="
          ls -la /tmp/usbip-tools-linux-${KERNEL_VERSION}.tar.gz

      - name: 收集所有产物
        run: |
          mkdir -p artifacts

          # 1. 复制所有 deb 包到 artifacts 根目录
          cp $KERNEL_SRC/../*.deb artifacts/ 2>/dev/null || true
          echo "=== 收集到的 deb 包 ==="
          ls -la artifacts/*.deb || echo "未找到 deb 包"

          # 2. 打包内核模块为 zip，直接放在 artifacts 根目录
          cd $KERNEL_SRC
          MODULE_ZIP="$GITHUB_WORKSPACE/artifacts/${ARTIFACT_NAME}-modules.zip"
          find . -name "*.ko" -type f | zip -q -@ "${MODULE_ZIP}"
          echo "内核模块已打包至: ${ARTIFACT_NAME}-modules.zip"

          # 3. 复制 USB/IP 工具包到 artifacts 根目录
          if [ -f /tmp/usbip-tools-linux-${KERNEL_VERSION}.tar.gz ]; then
            cp /tmp/usbip-tools-linux-${KERNEL_VERSION}.tar.gz artifacts/
            echo "USB/IP 工具包已复制"
          else
            echo "警告: USB/IP 工具包未找到，跳过"
          fi

          # 4. 生成说明文件
          cd $GITHUB_WORKSPACE/artifacts
          cat > RELEASE_INFO.txt << EOF
          内核版本：${KERNEL_VERSION}
          源码仓库：${KERNEL_REPO} (ref: ${KERNEL_REF})
          构建时间：$(date)
          GitHub 运行编号：${{ github.run_number }}

          包含的软件包：
          - linux-image-*.deb：内核镜像
          - linux-headers-*.deb：内核头文件
          - linux-libc-dev_*.deb：内核 C 库头文件

          内核模块打包文件：${ARTIFACT_NAME}-modules.zip
          USB/IP 用户空间工具包：usbip-tools-linux-${KERNEL_VERSION}.tar.gz

          已启用的关键功能：
          - 基础系统配置（SYSVIPC、EPOLL、TMPFS 等）
          - USB Gadget / UDC / libcomposite / 大容量存储
          - USB 转串口驱动（CH340/CH341, CH343P 作为模块）
          - USB/IP 客户端/服务端（直接编译进内核 + 用户空间工具）
          - LXC 容器完整支持（namespaces + cgroups）
          - VHD 启动支持（loop 设备 + NTFS3 驱动）
          - UVC 摄像头支持（直接编译进内核）
          - Btrfs 文件系统支持（作为模块）
          - RTL8xxxU 无线网卡支持（作为模块）
          - ZSTD 压缩算法支持（直接编译进内核）
          - KVM 虚拟化支持 (Intel VT-x)（直接编译进内核）
          - VFIO 设备直通支持（直接编译进内核）
          - Intel GVT-g 图形虚拟化支持（直接编译进内核）
          - Docker / Podman 完整支持（OverlayFS, FUSE, seccomp, TUN）
          - Apple Mac 设备驱动 (雷电, 触控板, 键盘, SMC)
          - 杜比音频支持 (HDMI/DP 音频编解码器)

          注意：Facetime HD 摄像头驱动由于 V4L2 符号不兼容，未包含在此次构建中。你可以稍后手动编译。
          EOF

          echo "=== artifacts 目录最终内容 ==="
          ls -la

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/
          retention-days: 30

  release:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-files/

      - name: 列出待发布文件
        run: |
          echo "=== release-files 目录内容 ==="
          ls -la release-files/

      - name: 创建 GitHub Release 并上传文件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.KERNEL_VERSION }}-${{ github.run_number }}
          name: Linux ${{ env.KERNEL_VERSION }} 定制内核
          body: |
            ## 📦 Linux ${{ env.KERNEL_VERSION }} 定制内核
            
            **源码仓库：** ${{ env.KERNEL_REPO }} (ref: ${{ env.KERNEL_REF }})
            **构建时间：** $(date)
            
            ### ✨ 已启用的功能
            
            - ✅ 基础系统配置（SYSVIPC、EPOLL、TMPFS 等）
            - ✅ USB Gadget / UDC / libcomposite
            - ✅ USB 转串口：CH340/CH341、CH343P（模块）
            - ✅ USB/IP（直接编译进内核 + 用户空间工具）
            - ✅ LXC 容器完整支持
            - ✅ VHD 启动支持（NTFS3）
            - ✅ UVC 摄像头、ZSTD 压缩
            - ✅ KVM + VFIO + Intel GVT-g 直通
            - ✅ Docker/Podman（OverlayFS, FUSE, seccomp, TUN）
            - ✅ Btrfs 文件系统支持（模块）
            - ✅ RTL8xxxU 无线网卡支持（模块）
            - ✅ Apple Mac 设备驱动 (雷电, 触控板, 键盘, SMC)
            - ✅ 杜比音频支持 (HDMI/DP 音频编解码器)
            
            > ⚠️ **Facetime HD 驱动**由于 V4L2 符号兼容性问题未包含在本次构建中。如有需要，请手动从 [patjak/facetimehd](https://github.com/patjak/facetimehd) 编译。
            
            ### 📁 产物文件
            - **.deb 文件**：内核镜像、头文件、C 库开发包
            - **modules.zip**：所有内核模块文件（.ko）
            - **usbip-tools-*.tar.gz**：USB/IP 用户空间工具（包含安装脚本）
            - **RELEASE_INFO.txt**：构建详细信息
            
            ### 🚀 快速安装
            ```bash
            # 安装内核
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb linux-libc-dev*.deb
            
            # （可选）提取内核模块
            unzip *-modules.zip -d /lib/modules/
            
            # （可选）安装 USB/IP 工具
            tar -xzf usbip-tools-linux-*.tar.gz
            cd usbip-tools/
            sudo ./install.sh
            
            sudo reboot
          files: |
            release-files/*.deb
            release-files/*-modules.zip
            release-files/usbip-tools-*.tar.gz
            release-files/RELEASE_INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
