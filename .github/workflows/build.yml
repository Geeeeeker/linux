          EOF
          fi
          # 新增 USB 3.2 / xHCI 支持（独立于 USB Gadget）
          if [[ "${{ github.event.inputs.feature_usb32 }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          # xHCI 主机控制器 (USB 3.0/3.1/3.2)
          CONFIG_USB_XHCI_HCD=y
          CONFIG_USB_XHCI_PCI=y
          CONFIG_USB_XHCI_PLATFORM=y
          CONFIG_USB_DYNAMIC_MINORS=y
          CONFIG_USB_SUSPEND=y
          EOF
          fi

