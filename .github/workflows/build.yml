name: 构建 Linux 定制内核

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Linux 内核版本'
        required: true
        type: choice
        default: '7.0'
        options:
          - '7.0'
          - '6.12'
          - '6.6'
          - '6.1'
          - '5.15'
          - '5.10'
          - '5.4'
          - '4.19'
          - '4.14'
          - '4.9'
          - '4.4'
      feature_base:
        description: '基础系统配置 (SYSVIPC, EPOLL, TMPFS等)'
        type: boolean
        default: true
      feature_usb_gadget:
        description: 'USB Gadget / UDC / libcomposite (含 USB 3.x 支持)'
        type: boolean
        default: true
      feature_usb_serial:
        description: 'USB 转串口 (CH340/CH341, CH343P)'
        type: boolean
        default: true
      feature_usbip:
        description: 'USB/IP 支持 (内核 + 用户空间工具)'
        type: boolean
        default: true
      feature_lxc:
        description: 'LXC 容器完整支持'
        type: boolean
        default: true
      feature_vhd:
        description: 'VHD 启动支持 (loop + NTFS3)'
        type: boolean
        default: true
      feature_uvc_zstd:
        description: 'UVC 摄像头 + ZSTD 压缩'
        type: boolean
        default: true
      feature_kvm_vfio:
        description: 'KVM + VFIO + Intel GVT-g 直通'
        type: boolean
        default: true
      feature_docker:
        description: 'Docker / Podman 完整支持'
        type: boolean
        default: true
      feature_btrfs:
        description: 'Btrfs 文件系统支持 (模块)'
        type: boolean
        default: true
      feature_rtl8xxxu:
        description: 'RTL8XXXU 无线网卡支持 (模块)'
        type: boolean
        default: true
      feature_apple:
        description: 'Apple Mac 设备驱动'
        type: boolean
        default: true
      feature_dolby:
        description: '杜比音频支持 (HDMI/DP)'
        type: boolean
        default: true
      feature_android:
        description: 'Android 容器支持 (Binder/Ashmem/ION)'
        type: boolean
        default: true
      feature_ksu:
        description: 'KernelSU 基础支持 (Kprobes)'
        type: boolean
        default: true

env:
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '7.0' }}
  ARCH: x86_64
  ARTIFACT_NAME: Kernel-Linux-${{ github.event.inputs.kernel_version || '7.0' }}-x86_64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc dwarves rsync cpio wget xz-utils git fakeroot dpkg-dev \
            libtool autoconf automake pkg-config libglib2.0-dev libudev-dev \
            libusb-1.0-0-dev libxml2-dev \
            debhelper libdw-dev

      - name: 打印编译环境信息
        run: |
          echo "=== 编译环境硬件信息 ==="
          lscpu | grep -E "Model name|Architecture|CPU\(s\)|Thread|Core|Socket" || true
          echo "内存:"
          free -h
          echo "系统:"
          lsb_release -a 2>/dev/null || cat /etc/os-release
          echo "GCC 版本:"
          gcc --version

      # ---------- 缓存 Linux 源码压缩包 ----------
      - name: 缓存 Linux 源码压缩包
        id: cache-src-tarball
        uses: actions/cache@v4
        with:
          path: linux.tar.gz
          key: linux-kernel-src-${{ env.KERNEL_VERSION }}

      - name: 下载 Linux 内核源码 (若未缓存)
        if: steps.cache-src-tarball.outputs.cache-hit != 'true'
        run: |
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          echo "下载 Linux ${KERNEL_VERSION} 源码..."
          wget -q "https://github.com/torvalds/linux/archive/refs/tags/v${KERNEL_VERSION}.tar.gz" -O linux.tar.gz

      # ---------- 解压源码 ----------
      - name: 解压源码并设置工作目录
        run: |
          tar -xzf linux.tar.gz
          mv linux-* linux-src
          echo "KERNEL_SRC=$(pwd)/linux-src" >> $GITHUB_ENV

      - name: 集成 CH343P 驱动源码
        if: github.event.inputs.feature_usb_serial == 'true'
        run: |
          cd $KERNEL_SRC
          if [ ! -f drivers/usb/serial/ch343.c ]; then
            wget -q https://raw.githubusercontent.com/WCHSoftGroup/ch343ser_linux/master/driver/ch343.c -O drivers/usb/serial/ch343.c
          fi
          if [ ! -f drivers/usb/serial/ch343.h ]; then
            wget -q https://raw.githubusercontent.com/WCHSoftGroup/ch343ser_linux/master/driver/ch343.h -O drivers/usb/serial/ch343.h
          fi

      - name: 生成主线默认配置
        run: |
          cd $KERNEL_SRC
          make defconfig

      - name: 应用自定义配置 (依赖链顺序 + 双重保险)
        run: |
          cd $KERNEL_SRC

          # 确保 scripts/config 可用
          if [ ! -f scripts/config ]; then
            echo "错误：scripts/config 缺失，无法配置内核"
            exit 1
          fi

          # 便捷函数：启用内置 (=y) 或模块 (=m)
          enable_opt() {
            local opt=$1
            local val=$2
            if [ "$val" = "m" ]; then
              ./scripts/config --module "$opt"
            else
              ./scripts/config --enable "$opt"
            fi
          }

          echo "=== 1. 启用基础依赖 ==="
          enable_opt CONFIG_SYSVIPC y
          enable_opt CONFIG_MODULES y
          enable_opt CONFIG_DEVTMPFS y
          enable_opt CONFIG_NET y
          enable_opt CONFIG_INET y
          enable_opt CONFIG_IKCONFIG y
          enable_opt CONFIG_IKCONFIG_PROC y
          enable_opt CONFIG_KALLSYMS y
          enable_opt CONFIG_KALLSYMS_ALL y

          # USB 核心依赖（如需任何 USB 功能）
          if [[ "${{ github.event.inputs.feature_usb_gadget }}" == "true" ]] || \
             [[ "${{ github.event.inputs.feature_usbip }}" == "true" ]] || \
             [[ "${{ github.event.inputs.feature_usb_serial }}" == "true" ]] || \
             [[ "${{ github.event.inputs.feature_uvc_zstd }}" == "true" ]]; then
            echo "=== 2. 启用 USB 核心支持 ==="
            enable_opt CONFIG_USB_SUPPORT y
            enable_opt CONFIG_USB_COMMON y
            enable_opt CONFIG_USB y
            enable_opt CONFIG_USB_PCI y
          fi

          # ---------- KVM / VFIO (关键：先启用虚拟化和 IOMMU) ----------
          if [[ "${{ github.event.inputs.feature_kvm_vfio }}" == "true" ]]; then
            echo "=== 3. 启用 KVM 与 VFIO ==="
            # 前置依赖
            enable_opt CONFIG_VIRTUALIZATION y
            enable_opt CONFIG_IOMMU_SUPPORT y
            enable_opt CONFIG_HAVE_KVM y
            enable_opt CONFIG_PARAVIRT y
            # KVM
            enable_opt CONFIG_KVM y
            enable_opt CONFIG_KVM_INTEL y
            # VFIO (依赖 IOMMU)
            enable_opt CONFIG_VFIO y
            enable_opt CONFIG_VFIO_PCI y
            enable_opt CONFIG_VFIO_IOMMU_TYPE1 y
            enable_opt CONFIG_VFIO_MDEV y
            # Intel GVT-g (可选)
            enable_opt CONFIG_DRM_I915_GVT y
            enable_opt CONFIG_DRM_I915_GVT_KVMGT y
          fi

          # ---------- USB Gadget / DWC3 ----------
          if [[ "${{ github.event.inputs.feature_usb_gadget }}" == "true" ]]; then
            echo "=== 4. 启用 USB Gadget 及 DWC3 ==="
            # 主机控制器
            enable_opt CONFIG_USB_XHCI_HCD y
            enable_opt CONFIG_USB_XHCI_PCI y
            enable_opt CONFIG_USB_XHCI_PLATFORM y
            # DWC3 核心与模式
            enable_opt CONFIG_USB_DWC3 y
            enable_opt CONFIG_USB_DWC3_HOST y
            enable_opt CONFIG_USB_DWC3_GADGET y
            enable_opt CONFIG_USB_DWC3_DUAL_ROLE y
            enable_opt CONFIG_USB_DWC3_PCI y
            # Gadget 框架依赖
            enable_opt CONFIG_USB_GADGET_SUPPORT y
            enable_opt CONFIG_USB_GADGET y
            enable_opt CONFIG_USB_CONFIGFS y
            enable_opt CONFIG_USB_LIBCOMPOSITE y
            # 功能模块
            enable_opt CONFIG_USB_CONFIGFS_F_FS y
            enable_opt CONFIG_USB_CONFIGFS_MASS_STORAGE y
            enable_opt CONFIG_USB_F_MASS_STORAGE y
            enable_opt CONFIG_USB_CONFIGFS_SERIAL y
            enable_opt CONFIG_USB_CONFIGFS_ACM y
            enable_opt CONFIG_USB_CONFIGFS_RNDIS y
            enable_opt CONFIG_USB_MASS_STORAGE y
          fi

          # ---------- USB 转串口 ----------
          if [[ "${{ github.event.inputs.feature_usb_serial }}" == "true" ]]; then
            echo "=== 5. 启用 USB Serial ==="
            enable_opt CONFIG_USB_SERIAL y
            enable_opt CONFIG_USB_SERIAL_GENERIC y
            enable_opt CONFIG_USB_SERIAL_CH341 y
            enable_opt CONFIG_USB_SERIAL_CH343 m
          fi

          # ---------- USB/IP ----------
          if [[ "${{ github.event.inputs.feature_usbip }}" == "true" ]]; then
            echo "=== 6. 启用 USB/IP ==="
            enable_opt CONFIG_USBIP_CORE y
            enable_opt CONFIG_USBIP_VHCI_HCD y
            enable_opt CONFIG_USBIP_HOST y
            ./scripts/config --set-val CONFIG_USBIP_VHCI_HC_PORTS 8
          fi

          # ---------- UVC 摄像头 + ZSTD ----------
          if [[ "${{ github.event.inputs.feature_uvc_zstd }}" == "true" ]]; then
            echo "=== 7. 启用 UVC 与 ZSTD ==="
            enable_opt CONFIG_USB_VIDEO_CLASS y
            enable_opt CONFIG_MEDIA_SUPPORT y
            enable_opt CONFIG_MEDIA_CAMERA_SUPPORT y
            enable_opt CONFIG_MEDIA_CONTROLLER y
            enable_opt CONFIG_VIDEO_DEV y
            enable_opt CONFIG_VIDEO_V4L2 y
            enable_opt CONFIG_V4L_PLATFORM_DRIVERS y
            enable_opt CONFIG_ZSTD_COMPRESS y
            enable_opt CONFIG_ZSTD_DECOMPRESS y
          fi

          # ---------- LXC 容器 ----------
          if [[ "${{ github.event.inputs.feature_lxc }}" == "true" ]]; then
            echo "=== 8. 启用 LXC 支持 ==="
            enable_opt CONFIG_NAMESPACES y
            enable_opt CONFIG_CGROUPS y
            enable_opt CONFIG_UTS_NS y
            enable_opt CONFIG_IPC_NS y
            enable_opt CONFIG_USER_NS y
            enable_opt CONFIG_PID_NS y
            enable_opt CONFIG_NET_NS y
            enable_opt CONFIG_CGROUP_DEVICE y
            enable_opt CONFIG_CGROUP_CPUACCT y
            enable_opt CONFIG_CGROUP_FREEZER y
            enable_opt CONFIG_CGROUP_SCHED y
            enable_opt CONFIG_CGROUP_PIDS y
            enable_opt CONFIG_MEMCG y
            enable_opt CONFIG_BLK_CGROUP y
            enable_opt CONFIG_CGROUP_NET_PRIO y
            enable_opt CONFIG_CGROUP_NET_CLASSID y
            enable_opt CONFIG_CFS_BANDWIDTH y
            enable_opt CONFIG_RT_GROUP_SCHED y
            enable_opt CONFIG_CHECKPOINT_RESTORE y
            enable_opt CONFIG_VETH y
            enable_opt CONFIG_BRIDGE y
            enable_opt CONFIG_BRIDGE_NETFILTER y
            enable_opt CONFIG_IP_NF_TARGET_MASQUERADE y
            enable_opt CONFIG_NETFILTER_XT_MATCH_ADDRTYPE y
            enable_opt CONFIG_NETFILTER_XT_MATCH_IPVS y
          fi

          # ---------- VHD (NTFS3) ----------
          if [[ "${{ github.event.inputs.feature_vhd }}" == "true" ]]; then
            echo "=== 9. 启用 NTFS3 ==="
            enable_opt CONFIG_BLK_DEV_LOOP y
            enable_opt CONFIG_NTFS3_FS y
            enable_opt CONFIG_NTFS3_LZX_XPRESS y
          fi

          # ---------- Docker (OverlayFS) ----------
          if [[ "${{ github.event.inputs.feature_docker }}" == "true" ]]; then
            echo "=== 10. 启用 Docker 支持 ==="
            enable_opt CONFIG_OVERLAY_FS m
            enable_opt CONFIG_FUSE_FS m
            enable_opt CONFIG_SECCOMP y
            enable_opt CONFIG_SECCOMP_FILTER y
            enable_opt CONFIG_TUN m
            enable_opt CONFIG_NETFILTER_XT_MATCH_CONNTRACK m
            enable_opt CONFIG_IP_NF_FILTER m
            enable_opt CONFIG_IP_NF_NAT m
            enable_opt CONFIG_CGROUP_BPF y
          fi

          # ---------- Btrfs ----------
          if [[ "${{ github.event.inputs.feature_btrfs }}" == "true" ]]; then
            echo "=== 11. 启用 Btrfs ==="
            enable_opt CONFIG_BTRFS_FS m
            enable_opt CONFIG_BTRFS_FS_POSIX_ACL y
          fi

          # ---------- RTL8XXXU ----------
          if [[ "${{ github.event.inputs.feature_rtl8xxxu }}" == "true" ]]; then
            echo "=== 12. 启用 RTL8XXXU ==="
            enable_opt CONFIG_RTL8XXXU m
            enable_opt CONFIG_RTL8XXXU_UNTESTED y
          fi

          # ---------- Apple 驱动 ----------
          if [[ "${{ github.event.inputs.feature_apple }}" == "true" ]]; then
            echo "=== 13. 启用 Apple 驱动 ==="
            enable_opt CONFIG_USB4 m
            enable_opt CONFIG_MOUSE_BCM5974 y
            enable_opt CONFIG_HID_MAGICMOUSE y
            enable_opt CONFIG_MACINTOSH_DRIVERS y
            enable_opt CONFIG_HID_APPLE y
            enable_opt CONFIG_KEYBOARD_APPLESPI y
            enable_opt CONFIG_SENSORS_APPLESMC y
          fi

          # ---------- 杜比音频 ----------
          if [[ "${{ github.event.inputs.feature_dolby }}" == "true" ]]; then
            echo "=== 14. 启用杜比音频 ==="
            enable_opt CONFIG_SND_HDA_INTEL y
            enable_opt CONFIG_SND_HDA_CODEC_HDMI y
            enable_opt CONFIG_SND_HDA_CODEC_DOLBY y
            enable_opt CONFIG_SND_HDA_CODEC_CIRRUS y
            enable_opt CONFIG_SND_HDA_CODEC_CS8409 y
          fi

          # ---------- Android 容器 ----------
          if [[ "${{ github.event.inputs.feature_android }}" == "true" ]]; then
            echo "=== 15. 启用 Android 支持 ==="
            enable_opt CONFIG_STAGING y
            enable_opt CONFIG_ASHMEM y
            enable_opt CONFIG_ANDROID y
            enable_opt CONFIG_ANDROID_BINDER_IPC y
            enable_opt CONFIG_ANDROID_BINDERFS y
            enable_opt CONFIG_ION y
            enable_opt CONFIG_ION_SYSTEM_HEAP y
          fi

          # ---------- KernelSU 基础 (Kprobes) ----------
          if [[ "${{ github.event.inputs.feature_ksu }}" == "true" ]]; then
            echo "=== 16. 启用 Kprobes ==="
            enable_opt CONFIG_KPROBES y
            enable_opt CONFIG_HAVE_KPROBES y
            enable_opt CONFIG_KPROBE_EVENTS y
            enable_opt CONFIG_DEBUG_FS y
          fi

          echo "=== 17. 运行 make olddefconfig 解析依赖 ==="
          if make olddefconfig 2>/dev/null; then
            echo "olddefconfig 执行成功。"
          else
            echo "olddefconfig 失败，使用 yes '' | make oldconfig"
            yes "" | make oldconfig
          fi

          # === 双重保险：强制再次启用关键选项 (防止被 olddefconfig 关闭) ===
          echo "=== 18. 双重保险：强制启用关键选项 ==="
          if [[ "${{ github.event.inputs.feature_kvm_vfio }}" == "true" ]]; then
            ./scripts/config --enable CONFIG_KVM || true
            ./scripts/config --enable CONFIG_KVM_INTEL || true
            ./scripts/config --enable CONFIG_VFIO || true
          fi
          if [[ "${{ github.event.inputs.feature_usb_gadget }}" == "true" ]]; then
            ./scripts/config --enable CONFIG_USB_GADGET || true
            ./scripts/config --enable CONFIG_USB_DWC3 || true
            ./scripts/config --enable CONFIG_USB_DWC3_HOST || true
            ./scripts/config --enable CONFIG_USB_DWC3_GADGET || true
          fi
          if [[ "${{ github.event.inputs.feature_btrfs }}" == "true" ]]; then
            ./scripts/config --module CONFIG_BTRFS_FS || true
          fi
          if [[ "${{ github.event.inputs.feature_docker }}" == "true" ]]; then
            ./scripts/config --module CONFIG_OVERLAY_FS || true
          fi
          if [[ "${{ github.event.inputs.feature_vhd }}" == "true" ]]; then
            ./scripts/config --enable CONFIG_NTFS3_FS || true
          fi
          if [[ "${{ github.event.inputs.feature_usbip }}" == "true" ]]; then
            ./scripts/config --enable CONFIG_USBIP_CORE || true
            ./scripts/config --enable CONFIG_USBIP_VHCI_HCD || true
          fi

          # 最终同步一次
          make olddefconfig 2>/dev/null || yes "" | make oldconfig

      - name: 显示关键配置状态 (验证)
        run: |
          cd $KERNEL_SRC
          echo "=== 已启用的配置项 (部分) ==="
          grep -E "CONFIG_VIRTUALIZATION|CONFIG_KVM[^_]|CONFIG_VFIO|CONFIG_USB_GADGET|CONFIG_USB_DWC3|CONFIG_USB_XHCI|CONFIG_USB_SERIAL_CH343|CONFIG_USBIP|CONFIG_USB_VIDEO_CLASS|CONFIG_KEYBOARD_APPLESPI|CONFIG_ZSTD_COMPRESS|CONFIG_NTFS3|CONFIG_OVERLAY_FS|CONFIG_BTRFS_FS|CONFIG_ASHMEM|CONFIG_KPROBES|CONFIG_KALLSYMS" .config || true

      - name: 编译内核 (生成二进制 deb 包，修复 4.4 源码包检查)
        run: |
          cd $KERNEL_SRC
          export KCFLAGS="-Wno-attributes -Wno-error"
          export KDEB_SOURCECHECK=false
          if make help | grep -q "bindeb-pkg"; then
            echo "使用 bindeb-pkg 构建"
            make -j$(nproc) bindeb-pkg LOCALVERSION=-${KERNEL_VERSION}
          else
            echo "使用 deb-pkg 构建"
            make -j$(nproc) deb-pkg LOCALVERSION=-${KERNEL_VERSION}
          fi

      - name: 编译 USB/IP 用户空间工具 (如果启用)
        if: github.event.inputs.feature_usbip == 'true'
        run: |
          cd $KERNEL_SRC/tools/usb/usbip
          echo "=== 开始编译 USB/IP 工具 ==="
          ./autogen.sh
          CFLAGS="-Wno-error" ./configure --prefix=/usr/local
          make -j$(nproc)
          mkdir -p /tmp/usbip-tools/usr/local/bin
          mkdir -p /tmp/usbip-tools/usr/local/lib
          mkdir -p /tmp/usbip-tools/usr/local/sbin
          make install DESTDIR=/tmp/usbip-tools
          find /tmp/usbip-tools -name "*.so*" -exec cp -P {} /tmp/usbip-tools/usr/local/lib/ \; 2>/dev/null || true
          cat > /tmp/usbip-tools/install.sh << 'EOF'
          #!/bin/bash
          echo "安装 USB/IP 工具..."
          cp -r usr/local/bin/* /usr/local/bin/ 2>/dev/null || true
          cp -r usr/local/sbin/* /usr/local/sbin/ 2>/dev/null || true
          cp -r usr/local/lib/* /usr/local/lib/ 2>/dev/null || true
          ldconfig
          echo "USB/IP 工具安装完成！"
          EOF
          chmod +x /tmp/usbip-tools/install.sh
          echo "=== USB/IP 工具编译完成 ==="
          ls -la /tmp/usbip-tools/usr/local/bin/
          ls -la /tmp/usbip-tools/usr/local/lib/

      - name: 收集构建产物 (分离 deb、内核模块、usbip)
        run: |
          mkdir -p artifacts
          cp $KERNEL_SRC/../*.deb artifacts/ 2>/dev/null || true
          echo "=== 收集到的 deb 包 ==="
          ls -la artifacts/*.deb || echo "未找到 deb 包"

          cd $KERNEL_SRC
          MODULE_ZIP="$GITHUB_WORKSPACE/artifacts/${ARTIFACT_NAME}-modules.zip"
          find . -name "*.ko" -type f | zip -q -@ "${MODULE_ZIP}"
          find . -name "*.ko" -type f > $GITHUB_WORKSPACE/artifacts/modules-list.txt
          echo "内核模块已打包至: ${ARTIFACT_NAME}-modules.zip"

          if [ -d /tmp/usbip-tools ] && [ -n "$(ls -A /tmp/usbip-tools/usr/local/bin 2>/dev/null)" ]; then
            cd /tmp
            tar -czf usbip-tools-linux-${KERNEL_VERSION}.tar.gz usbip-tools/
            cp usbip-tools-linux-${KERNEL_VERSION}.tar.gz $GITHUB_WORKSPACE/artifacts/
            echo "USB/IP 工具已打包"
          else
            echo "警告: USB/IP 工具目录为空，跳过打包。"
          fi

          cd $GITHUB_WORKSPACE/artifacts
          cat > RELEASE_INFO.txt << EOF
          内核版本：${KERNEL_VERSION}
          构建时间：$(date)
          GitHub 运行编号：${{ github.run_number }}
          用户选择的功能：
          - 基础系统配置: ${{ github.event.inputs.feature_base }}
          - USB Gadget/UDC (含 USB 3.x 完整支持): ${{ github.event.inputs.feature_usb_gadget }}
          - USB 转串口: ${{ github.event.inputs.feature_usb_serial }}
          - USB/IP: ${{ github.event.inputs.feature_usbip }}
          - LXC 容器: ${{ github.event.inputs.feature_lxc }}
          - VHD 启动: ${{ github.event.inputs.feature_vhd }}
          - UVC/ZSTD: ${{ github.event.inputs.feature_uvc_zstd }}
          - KVM/VFIO: ${{ github.event.inputs.feature_kvm_vfio }}
          - Docker/Podman: ${{ github.event.inputs.feature_docker }}
          - Btrfs: ${{ github.event.inputs.feature_btrfs }}
          - RTL8xxxU: ${{ github.event.inputs.feature_rtl8xxxu }}
          - Apple 驱动: ${{ github.event.inputs.feature_apple }}
          - 杜比音频: ${{ github.event.inputs.feature_dolby }}
          - Android 容器: ${{ github.event.inputs.feature_android }}
          - KernelSU 基础: ${{ github.event.inputs.feature_ksu }}
          - Apache 符号支持: CONFIG_KALLSYMS=y, CONFIG_KALLSYMS_ALL=y
          产物文件：
          - *.deb                : 内核安装包
          - *-modules.zip        : 内核模块 (.ko)
          - usbip-tools-*.tar.gz : USB/IP 用户空间工具（如启用）
          EOF

      - name: 上传构建产物到临时 Artifact（供 Release 使用）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/
          retention-days: 7

  release:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 下载 Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-files/

      - name: 列出待发布文件
        run: |
          echo "=== release-files 目录内容 ==="
          ls -la release-files/

      - name: 创建 GitHub Release 并分别上传文件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.KERNEL_VERSION }}-${{ github.run_number }}
          name: Linux ${{ env.KERNEL_VERSION }} 定制内核
          body: |
            ## 📦 Linux ${{ env.KERNEL_VERSION }} 定制内核
            **构建时间：** $(date)
            **用户选择的功能：**
            - 基础系统配置: ${{ github.event.inputs.feature_base }}
            - USB Gadget/UDC (含 USB 3.x 完整支持): ${{ github.event.inputs.feature_usb_gadget }}
            - USB 转串口: ${{ github.event.inputs.feature_usb_serial }}
            - USB/IP: ${{ github.event.inputs.feature_usbip }}
            - LXC 容器: ${{ github.event.inputs.feature_lxc }}
            - VHD 启动: ${{ github.event.inputs.feature_vhd }}
            - UVC/ZSTD: ${{ github.event.inputs.feature_uvc_zstd }}
            - KVM/VFIO: ${{ github.event.inputs.feature_kvm_vfio }}
            - Docker/Podman: ${{ github.event.inputs.feature_docker }}
            - Btrfs: ${{ github.event.inputs.feature_btrfs }}
            - RTL8xxxU: ${{ github.event.inputs.feature_rtl8xxxu }}
            - Apple 驱动: ${{ github.event.inputs.feature_apple }}
            - 杜比音频: ${{ github.event.inputs.feature_dolby }}
            - Android 容器: ${{ github.event.inputs.feature_android }}
            - KernelSU 基础: ${{ github.event.inputs.feature_ksu }}
            - **Apache 符号支持**: CONFIG_KALLSYMS=y + CONFIG_KALLSYMS_ALL=y (完整)
            ### 📁 产物说明
            - **.deb 文件**：内核镜像、头文件、C 库开发包
            - **Kernel-Linux-版本-x86_64-modules.zip**：所有内核模块文件（.ko）
            - **usbip-tools-linux-版本.tar.gz**：USB/IP 用户空间工具（如启用）
            - **RELEASE_INFO.txt**：构建详细信息
            ### 🚀 快速安装
            ```bash
            # 安装内核
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb linux-libc-dev*.deb
            # （可选）提取内核模块
            unzip Kernel-Linux-*-modules.zip -d /lib/modules/
            # （可选）安装 USB/IP 工具
            tar -xzf usbip-tools-linux-*.tar.gz
            cd usbip-tools/
            sudo ./install.sh
            sudo reboot
          files: |
            release-files/*.deb
            release-files/*-modules.zip
            release-files/usbip-tools-*.tar.gz
            release-files/RELEASE_INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
