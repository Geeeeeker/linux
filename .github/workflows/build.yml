name: 构建 Linux 定制内核

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Linux 内核版本'
        required: true
        type: choice
        default: '7.0'
        options:
          - '7.0'
          - '6.12'
          - '6.6'
          - '6.1'
          - '5.15'
          - '5.10'
          - '5.4'
          - '4.19'
          - '4.14'
          - '4.9'
          - '4.4'
      feature_base:
        description: '基础系统配置 (SYSVIPC, EPOLL, TMPFS等)'
        type: boolean
        default: true
      feature_usb_gadget:
        description: 'USB Gadget / UDC / libcomposite'
        type: boolean
        default: true
      feature_usb_serial:
        description: 'USB 转串口 (CH340/CH341, CH343P)'
        type: boolean
        default: true
      feature_usbip:
        description: 'USB/IP 支持 (内核 + 用户空间工具)'
        type: boolean
        default: true
      feature_lxc:
        description: 'LXC 容器完整支持'
        type: boolean
        default: true
      feature_vhd:
        description: 'VHD 启动支持 (loop + NTFS3)'
        type: boolean
        default: true
      feature_uvc_zstd:
        description: 'UVC 摄像头 + ZSTD 压缩'
        type: boolean
        default: true
      feature_kvm_vfio:
        description: 'KVM + VFIO + Intel GVT-g 直通'
        type: boolean
        default: true
      feature_docker:
        description: 'Docker / Podman 完整支持'
        type: boolean
        default: true
      feature_btrfs:
        description: 'Btrfs 文件系统支持 (模块)'
        type: boolean
        default: true
      feature_rtl8xxxu:
        description: 'RTL8XXXU 无线网卡支持 (模块)'
        type: boolean
        default: true
      feature_apple:
        description: 'Apple Mac 设备驱动'
        type: boolean
        default: true
      feature_dolby:
        description: '杜比音频支持 (HDMI/DP)'
        type: boolean
        default: true
      feature_android:
        description: 'Android 容器支持 (Binder/Ashmem/ION)'
        type: boolean
        default: true
      feature_ksu:
        description: 'KernelSU 基础支持 (Kprobes)'
        type: boolean
        default: true
      feature_usb32:
        description: 'USB 3.2 完整支持 (xHCI 主机控制器)'
        type: boolean
        default: true

env:
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '7.0' }}
  ARCH: x86_64
  ARTIFACT_NAME: Kernel-Linux-${{ github.event.inputs.kernel_version || '7.0' }}-x86_64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc dwarves rsync cpio wget xz-utils git fakeroot dpkg-dev \
            libtool autoconf automake pkg-config libglib2.0-dev libudev-dev \
            libusb-1.0-0-dev libxml2-dev \
            debhelper libdw-dev

      - name: 打印编译环境信息
        run: |
          echo "=== 编译环境硬件信息 ==="
          lscpu | grep -E "Model name|Architecture|CPU\(s\)|Thread|Core|Socket" || true
          echo "内存:"
          free -h
          echo "系统:"
          lsb_release -a 2>/dev/null || cat /etc/os-release
          echo "GCC 版本:"
          gcc --version

      - name: 缓存 Linux 源码压缩包
        id: cache-src-tarball
        uses: actions/cache@v4
        with:
          path: linux.tar.gz
          key: linux-kernel-src-${{ env.KERNEL_VERSION }}

      - name: 下载 Linux 内核源码 (若未缓存)
        if: steps.cache-src-tarball.outputs.cache-hit != 'true'
        run: |
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          echo "下载 Linux ${KERNEL_VERSION} 源码..."
          wget -q "https://github.com/torvalds/linux/archive/refs/tags/v${KERNEL_VERSION}.tar.gz" -O linux.tar.gz

      - name: 解压源码并设置工作目录
        run: |
          tar -xzf linux.tar.gz
          mv linux-* linux-src
          echo "KERNEL_SRC=$(pwd)/linux-src" >> $GITHUB_ENV

      - name: 集成 CH343P 驱动源码
        if: github.event.inputs.feature_usb_serial == 'true'
        run: |
          cd $KERNEL_SRC
          if [ ! -f drivers/usb/serial/ch343.c ]; then
            wget -q https://raw.githubusercontent.com/WCHSoftGroup/ch343ser_linux/master/driver/ch343.c -O drivers/usb/serial/ch343.c
          fi
          if [ ! -f drivers/usb/serial/ch343.h ]; then
            wget -q https://raw.githubusercontent.com/WCHSoftGroup/ch343ser_linux/master/driver/ch343.h -O drivers/usb/serial/ch343.h
          fi

      - name: 生成主线默认配置
        run: |
          cd $KERNEL_SRC
          make defconfig

      - name: 创建自定义内核配置片段 (完整版)
        run: |
          cd $KERNEL_SRC
          cat > custom-features.cfg << 'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_SYSVIPC_COMPAT=y
          CONFIG_EPOLL=y
          CONFIG_EVENTFD=y
          CONFIG_SIGNALFD=y
          CONFIG_INOTIFY_USER=y
          CONFIG_SHMEM=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF
          if [[ "${{ github.event.inputs.feature_usb_gadget }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_DWC3=y
          CONFIG_USB_DWC3_HOST=y
