name: 构建 Linux 定制内核

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Linux 内核版本'
        required: true
        type: choice
        default: '7.0'
        options:
          - '7.0'
          - '6.12'
          - '6.6'
          - '6.1'
          - '5.15'
          - '5.10'
          - '5.4'
          - '4.19'
          - '4.14'
          - '4.9'
          - '4.4'
      feature_base:
        description: '基础系统配置 (含 Intel 平台驱动)'
        type: boolean
        default: true
      feature_usb_gadget:
        description: 'USB Gadget / UDC / libcomposite'
        type: boolean
        default: true
      feature_usb_serial:
        description: 'USB 转串口 (CH340/CH341, CH343P)'
        type: boolean
        default: true
      feature_usbip:
        description: 'USB/IP 支持 (内核 + 用户空间工具)'
        type: boolean
        default: true
      feature_lxc:
        description: 'LXC 容器完整支持'
        type: boolean
        default: true
      feature_vhd:
        description: 'VHD 启动支持 (loop + NTFS3)'
        type: boolean
        default: true
      feature_kvm_vfio:
        description: 'KVM + VFIO + Intel GVT-g 直通'
        type: boolean
        default: true
      feature_docker:
        description: 'Docker / Podman 完整支持'
        type: boolean
        default: true
      feature_btrfs:
        description: 'Btrfs 文件系统支持 (模块)'
        type: boolean
        default: true
      feature_rtl8xxxu:
        description: 'RTL8XXXU 无线网卡支持 (模块)'
        type: boolean
        default: true
      feature_apple:
        description: 'Apple Mac 设备驱动'
        type: boolean
        default: true
      feature_audio:
        description: '音频支持 (Intel HDA / 杜比 / HDMI / ALSA)'
        type: boolean
        default: true
      feature_android:
        description: 'Android 容器支持 (Binder/Ashmem/ION)'
        type: boolean
        default: true
      feature_ksu:
        description: 'KernelSU 基础支持 (Kprobes)'
        type: boolean
        default: true
      feature_xhci:
        description: 'xHCI 主机控制器支持 (USB 3.x 主控)'
        type: boolean
        default: true
      feature_usb3_2:
        description: 'USB 3.2 SuperSpeed 支持'
        type: boolean
        default: true
      feature_qemu:
        description: 'QEMU 虚拟化支持 (Virtio, 9p, GPU)'
        type: boolean
        default: true
      feature_nvidia_gpu:
        description: 'NVIDIA 显卡支持 (Nouveau 开源驱动)'
        type: boolean
        default: false
      feature_amd_gpu:
        description: 'AMD 显卡支持 (amdgpu)'
        type: boolean
        default: false
      feature_intel_eth:
        description: 'Intel 有线网卡 (e1000e, igb)'
        type: boolean
        default: true
      feature_realtek_eth:
        description: 'Realtek 有线网卡 (r8169)'
        type: boolean
        default: true
      feature_intel_wifi:
        description: 'Intel 无线网卡 (iwlwifi)'
        type: boolean
        default: false
      feature_broadcom_wifi:
        description: 'Broadcom 无线网卡 (b43, brcmfmac)'
        type: boolean
        default: false
      feature_bluetooth:
        description: '蓝牙支持 (BT, BTHID, RFCOMM)'
        type: boolean
        default: false
      feature_amd_platform:
        description: 'AMD 主板平台驱动 (USB, RAID, SATA, NVMe, 声卡等)'
        type: boolean
        default: false
      # ----- 新拆分/新增选项 -----
      feature_uvc:
        description: 'USB Video Class 摄像头支持'
        type: boolean
        default: true
      feature_zstd:
        description: 'ZSTD 压缩/解压缩支持'
        type: boolean
        default: true
      feature_usb_mass_storage:
        description: 'USB 大容量存储(UMS)'
        type: boolean
        default: true
      feature_fingerprint:
        description: '指纹识别驱动'
        type: boolean
        default: false
      feature_ir:
        description: '红外线设备支持 (IrDA, RC 核心)'
        type: boolean
        default: false
      feature_facecam:
        description: '人脸识别专用摄像头驱动'
        type: boolean
        default: false
      feature_touchscreen:
        description: '触摸屏驱动 (USB / I2C / HID)'
        type: boolean
        default: false
      feature_sensors:
        description: '重力感应 / 加速度计 / 环境光 / 接近传感器'
        type: boolean
        default: false
      feature_gps:
        description: 'GPS / 北斗导航接收器'
        type: boolean
        default: false
      feature_mobile_wwan:
        description: '3G/4G/5G 移动通信模块 (CDC MBIM/QMI/NCM/ECM)'
        type: boolean
        default: false
      feature_modem:
        description: '调制解调器 / 传真机支持'
        type: boolean
        default: false
      feature_printer:
        description: '打印机 / 扫描仪支持 (USB Printer Class)'
        type: boolean
        default: false
      feature_digital_cam:
        description: '数码相机驱动 (佳能、尼康、索尼等 PTP/MTP)'
        type: boolean
        default: false
      feature_misc_usb:
        description: '其他 USB 设备 (电视卡、收音机、网络摄像头等)'
        type: boolean
        default: false

env:
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '7.0' }}
  ARCH: x86_64
  ARTIFACT_NAME: Kernel-Linux-${{ github.event.inputs.kernel_version || '7.0' }}-x86_64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc dwarves rsync cpio wget xz-utils git fakeroot dpkg-dev \
            libtool autoconf automake pkg-config libglib2.0-dev libudev-dev \
            libusb-1.0-0-dev libxml2-dev \
            debhelper libdw-dev

      - name: 打印编译环境信息
        run: |
          echo "=== 编译环境硬件信息 ==="
          lscpu | grep -E "Model name|Architecture|CPU\(s\)|Thread|Core|Socket" || true
          echo "内存:"
          free -h
          echo "系统:"
          lsb_release -a 2>/dev/null || cat /etc/os-release
          echo "GCC 版本:"
          gcc --version

      # ---------- 缓存 Linux 源码压缩包 ----------
      - name: 缓存 Linux 源码压缩包
        id: cache-src-tarball
        uses: actions/cache@v4
        with:
          path: linux.tar.gz
          key: linux-kernel-src-${{ env.KERNEL_VERSION }}

      - name: 下载 Linux 内核源码 (若未缓存)
        if: steps.cache-src-tarball.outputs.cache-hit != 'true'
        run: |
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          echo "下载 Linux ${KERNEL_VERSION} 源码..."
          wget -q "https://github.com/torvalds/linux/archive/refs/tags/v${KERNEL_VERSION}.tar.gz" -O linux.tar.gz

      # ---------- 解压源码 ----------
      - name: 解压源码并设置工作目录
        run: |
          tar -xzf linux.tar.gz
          mv linux-* linux-src
          echo "KERNEL_SRC=$(pwd)/linux-src" >> $GITHUB_ENV

      - name: 生成主线默认配置
        run: |
          cd $KERNEL_SRC
          make defconfig

      - name: 创建自定义内核配置片段 (完整扩展版)
        run: |
          cd $KERNEL_SRC
          cat > custom-features.cfg << 'EOF'
          # 基础系统配置（含 Intel 平台 RAID/SATA/NVMe/电源管理）
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_SYSVIPC_COMPAT=y
          CONFIG_EPOLL=y
          CONFIG_EVENTFD=y
          CONFIG_SIGNALFD=y
          CONFIG_INOTIFY_USER=y
          CONFIG_SHMEM=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_USB_SUPPORT=y
          CONFIG_PCI=y
          CONFIG_USB_COMMON=y
          CONFIG_BLK_DEV_SD=y
          CONFIG_ATA=y
          CONFIG_SATA_AHCI=y
          CONFIG_SATA_MOBILE_LPM_POLICY=0
          CONFIG_ATA_SFF=y
          CONFIG_ATA_BMDMA=y
          CONFIG_PATA_OLDPIIX=y
          CONFIG_PATA_SCH=y
          CONFIG_NVME_CORE=y
          CONFIG_BLK_DEV_NVME=y
          CONFIG_NVME_MULTIPATH=y
          CONFIG_INTEL_IDMA64=y
          CONFIG_INTEL_IOMMU=y
          CONFIG_INTEL_IOMMU_DEFAULT_ON=y
          CONFIG_INTEL_POWERCLAMP=y
          CONFIG_INTEL_RAPL=y
          CONFIG_INTEL_SPEED_SELECT_INTERFACE=y
          CONFIG_INTEL_UNCORE_FREQ_CONTROL=y
          CONFIG_PM=y
          CONFIG_ACPI=y
          CONFIG_CPU_FREQ=y
          CONFIG_CPU_IDLE=y
          CONFIG_I2C_I801=y
          CONFIG_GPIO_SCH=y
          CONFIG_PINCTRL=y
          CONFIG_PINCTRL_INTEL=y
          CONFIG_WATCHDOG=y
          EOF

          # USB Gadget / dwc3
          if [[ "${{ github.event.inputs.feature_usb_gadget }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_DWC3=y
          CONFIG_USB_DWC3_HOST=y
          CONFIG_USB_DWC3_GADGET=y
          CONFIG_USB_DWC3_DUAL_ROLE=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_F_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_SERIAL=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_F_LB_SS=y
          CONFIG_USB_MASS_STORAGE=y
          EOF
          fi

          # USB 转串口 (CH343)
          if [[ "${{ github.event.inputs.feature_usb_serial }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_GENERIC=y
          CONFIG_USB_SERIAL_CH341=y
          CONFIG_USB_SERIAL_CH343=m
          EOF
            if [ ! -f drivers/usb/serial/ch343.c ]; then
              wget -q --tries=3 --timeout=10 https://raw.githubusercontent.com/WCHSoftGroup/ch343ser_linux/master/driver/ch343.c -O drivers/usb/serial/ch343.c || echo "警告: 下载 ch343.c 失败"
              wget -q --tries=3 --timeout=10 https://raw.githubusercontent.com/WCHSoftGroup/ch343ser_linux/master/driver/ch343.h -O drivers/usb/serial/ch343.h || echo "警告: 下载 ch343.h 失败"
            fi
            if ! grep -q "config USB_SERIAL_CH343" drivers/usb/serial/Kconfig; then
              echo "" >> drivers/usb/serial/Kconfig
              echo "config USB_SERIAL_CH343" >> drivers/usb/serial/Kconfig
              echo "	tristate \"CH343 USB serial driver\"" >> drivers/usb/serial/Kconfig
              echo "	help" >> drivers/usb/serial/Kconfig
              echo "	  Say Y here to include support for CH343 USB to serial adapter." >> drivers/usb/serial/Kconfig
            fi
            if ! grep -q "obj-\$(CONFIG_USB_SERIAL_CH343)" drivers/usb/serial/Makefile; then
              echo "obj-\$(CONFIG_USB_SERIAL_CH343) += ch343.o" >> drivers/usb/serial/Makefile
            fi
          fi

          # USB/IP
          if [[ "${{ github.event.inputs.feature_usbip }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USBIP_CORE=y
          CONFIG_USBIP_VHCI_HCD=y
          CONFIG_USBIP_HOST=y
          CONFIG_USBIP_VHCI_HC_PORTS=8
          EOF
          fi

          # LXC 容器
          if [[ "${{ github.event.inputs.feature_lxc }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_NAMESPACES=y
          CONFIG_CGROUPS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_BLK_CGROUP=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CGROUP_NET_CLASSID=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_RT_GROUP_SCHED=y
          CONFIG_CHECKPOINT_RESTORE=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          EOF
          fi

          # VHD 启动
          if [[ "${{ github.event.inputs.feature_vhd }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_BLK_DEV_LOOP=y
          CONFIG_NTFS3_FS=y
          CONFIG_NTFS3_LZX_XPRESS=y
          CONFIG_NTFS_FS=n
          EOF
          fi

          # KVM + VFIO
          if [[ "${{ github.event.inputs.feature_kvm_vfio }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_KVM=y
          CONFIG_KVM_INTEL=y
          CONFIG_VFIO=y
          CONFIG_VFIO_PCI=y
          CONFIG_VFIO_IOMMU_TYPE1=y
          CONFIG_VFIO_MDEV=y
          CONFIG_DRM_I915_GVT=y
          CONFIG_DRM_I915_GVT_KVMGT=y
          EOF
          fi

          # Docker / Podman
          if [[ "${{ github.event.inputs.feature_docker }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_OVERLAY_FS=m
          CONFIG_FUSE_FS=m
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_TUN=m
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
          CONFIG_IP_NF_FILTER=m
          CONFIG_IP_NF_NAT=m
          CONFIG_CGROUP_BPF=y
          EOF
          fi

          # Btrfs
          if [[ "${{ github.event.inputs.feature_btrfs }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_BTRFS_FS=m
          CONFIG_BTRFS_FS_POSIX_ACL=y
          EOF
          fi

          # RTL8XXXU
          if [[ "${{ github.event.inputs.feature_rtl8xxxu }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_RTL8XXXU=m
          CONFIG_RTL8XXXU_UNTESTED=y
          EOF
          fi

          # Apple 驱动
          if [[ "${{ github.event.inputs.feature_apple }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB4=m
          CONFIG_MOUSE_BCM5974=y
          CONFIG_HID_MAGICMOUSE=y
          CONFIG_MACINTOSH_DRIVERS=y
          CONFIG_HID_APPLE=y
          CONFIG_KEYBOARD_APPLESPI=y
          CONFIG_SENSORS_APPLESMC=y
          CONFIG_MEDIA_SUPPORT=y
          CONFIG_MEDIA_CAMERA_SUPPORT=y
          CONFIG_MEDIA_CONTROLLER=y
          CONFIG_VIDEO_DEV=y
          CONFIG_VIDEO_V4L2=y
          CONFIG_VIDEOBUF2_CORE=y
          CONFIG_VIDEOBUF2_V4L2=y
          CONFIG_VIDEOBUF2_MEMOPS=y
          CONFIG_VIDEOBUF2_VMALLOC=y
          CONFIG_VIDEOBUF2_DMA_SG=y
          CONFIG_V4L_PLATFORM_DRIVERS=y
          CONFIG_V4L_MEM2MEM_DRIVERS=y
          EOF
          fi

          # 音频支持 (含原杜比、HDMI、ALSA)
          if [[ "${{ github.event.inputs.feature_audio }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_SOUND=y
          CONFIG_SND=y
          CONFIG_SND_HDA_INTEL=y
          CONFIG_SND_HDA_CODEC_HDMI=y
          CONFIG_SND_HDA_CODEC_DOLBY=y
          CONFIG_SND_HDA_CODEC_CIRRUS=y
          CONFIG_SND_HDA_CODEC_CS8409=y
          CONFIG_SND_HDA_CODEC_REALTEK=y
          CONFIG_SND_HDA_CODEC_ANALOG=y
          CONFIG_SND_HDA_CODEC_SIGMATEL=y
          CONFIG_SND_HDA_CODEC_VIA=y
          CONFIG_SND_HDA_CODEC_CA0132=y
          CONFIG_SND_HDA_CODEC_CMEDIA=y
          CONFIG_SND_HDA_CODEC_SI3054=y
          CONFIG_SND_HDA_GENERIC=y
          CONFIG_SND_HDA_POWER_SAVE_DEFAULT=1
          CONFIG_SND_HDA_CORE=y
          CONFIG_SND_HDA_PREALLOC_SIZE=64
          CONFIG_SND_USB_AUDIO=y
          CONFIG_SND_SOC=y
          CONFIG_SND_SOC_INTEL_SST=y
          CONFIG_SND_SOC_INTEL_SKYLAKE=y
          CONFIG_SND_SOC_INTEL_KBL=y
          CONFIG_SND_SOC_INTEL_CNL=y
          CONFIG_SND_SOC_INTEL_ICL=y
          CONFIG_SND_SOC_INTEL_TGL=y
          CONFIG_SND_SOC_INTEL_EHL=y
          CONFIG_SND_SOC_AMD_ACP=y
          CONFIG_SND_SOC_AMD_ACP3x=y
          CONFIG_SND_SOC_AMD_RENOIR=y
          EOF
          fi

          # Android 容器
          if [[ "${{ github.event.inputs.feature_android }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_STAGING=y
          CONFIG_ASHMEM=y
          CONFIG_ANDROID=y
          CONFIG_ANDROID_BINDER_IPC=y
          CONFIG_ANDROID_BINDERFS=y
          CONFIG_ION=y
          CONFIG_ION_SYSTEM_HEAP=y
          EOF
          fi

          # KernelSU (Kprobes)
          if [[ "${{ github.event.inputs.feature_ksu }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_DEBUG_FS=y
          EOF
          fi

          # xHCI
          if [[ "${{ github.event.inputs.feature_xhci }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_XHCI_HCD=y
          CONFIG_USB_XHCI_PCI=y
          CONFIG_USB_XHCI_PLATFORM=y
          EOF
          fi

          # USB 3.2 SuperSpeed
          if [[ "${{ github.event.inputs.feature_usb3_2 }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_SUPERSPEED=y
          CONFIG_USB_SUPERSPEED_PLUS=y
          CONFIG_USB_DEFAULT_PERSIST=y
          EOF
          fi

          # QEMU 虚拟化
          if [[ "${{ github.event.inputs.feature_qemu }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_VIRTIO_PCI=y
          CONFIG_VIRTIO_BALLOON=y
          CONFIG_VIRTIO_BLK=y
          CONFIG_VIRTIO_NET=y
          CONFIG_VIRTIO_CONSOLE=y
          CONFIG_VIRTIO_FS=y
          CONFIG_VIRTIO_GPU=y
          CONFIG_VIRTIO_INPUT=y
          CONFIG_VIRTIO_MMIO=y
          CONFIG_VIRTIO_PMEM=y
          CONFIG_NET_9P=y
          CONFIG_NET_9P_VIRTIO=y
          CONFIG_9P_FS=y
          CONFIG_9P_FS_POSIX_ACL=y
          CONFIG_9P_FS_SECURITY=y
          CONFIG_SCSI_VIRTIO=y
          EOF
          fi

          # NVIDIA 显卡 (Nouveau)
          if [[ "${{ github.event.inputs.feature_nvidia_gpu }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_DRM_NOUVEAU=y
          CONFIG_NOUVEAU_DEBUG=0
          CONFIG_NOUVEAU_DEBUG_DEFAULT=0
          CONFIG_DRM_NOUVEAU_BACKLIGHT=y
          EOF
          fi

          # AMD 显卡 (amdgpu)
          if [[ "${{ github.event.inputs.feature_amd_gpu }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_DRM_AMDGPU=y
          CONFIG_DRM_AMDGPU_SI=y
          CONFIG_DRM_AMDGPU_CIK=y
          CONFIG_DRM_AMDGPU_USERPTR=y
          CONFIG_HSA_AMD=y
          EOF
          fi

          # Intel 有线网卡
          if [[ "${{ github.event.inputs.feature_intel_eth }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_E1000=y
          CONFIG_E1000E=y
          CONFIG_IGB=y
          CONFIG_IGBVF=y
          CONFIG_IXGB=y
          CONFIG_IXGBE=y
          CONFIG_IXGBEVF=y
          CONFIG_I40E=y
          CONFIG_ICE=y
          EOF
          fi

          # Realtek 有线网卡
          if [[ "${{ github.event.inputs.feature_realtek_eth }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_R8169=y
          EOF
          fi

          # Intel 无线网卡
          if [[ "${{ github.event.inputs.feature_intel_wifi }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_WLAN=y
          CONFIG_WLAN_VENDOR_INTEL=y
          CONFIG_IWLWIFI=y
          CONFIG_IWLDVM=y
          CONFIG_IWLMVM=y
          CONFIG_IWLWIFI_OPMODE_MODULAR=y
          EOF
          fi

          # Broadcom 无线网卡
          if [[ "${{ github.event.inputs.feature_broadcom_wifi }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_WLAN_VENDOR_BROADCOM=y
          CONFIG_B43=y
          CONFIG_B43_PCI_AUTOSELECT=y
          CONFIG_B43_PCICORE_AUTOSELECT=y
          CONFIG_B43_PHY_N=y
          CONFIG_B43_PHY_LP=y
          CONFIG_B43_PHY_HT=y
          CONFIG_BRCMFMAC=y
          EOF
          fi

          # 蓝牙支持
          if [[ "${{ github.event.inputs.feature_bluetooth }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_BT=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=y
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_HS=y
          CONFIG_BT_LE=y
          CONFIG_BT_BCM=y
          CONFIG_BT_RTL=y
          CONFIG_BT_INTEL=y
          CONFIG_BT_HCIBTUSB=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_BCSP=y
          CONFIG_BT_HCIUART_ATH3K=y
          CONFIG_BT_HCIUART_LL=y
          CONFIG_BT_HCIUART_INTEL=y
          CONFIG_BT_HCIUART_BCM=y
          CONFIG_BT_HCIUART_RTL=y
          CONFIG_BT_HCIUART_QCA=y
          CONFIG_BT_HCIUART_AG6XX=y
          CONFIG_BT_HCIBCM203X=y
          CONFIG_BT_HCIBPA10X=y
          CONFIG_BT_HCIBFUSB=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_BT_MRVL=y
