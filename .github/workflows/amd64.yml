name: 构建 Linux 定制内核

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Linux 内核版本'
        required: true
        type: choice
        default: '7.0'
        options:
          - '7.0'
          - '6.12'
          - '6.6'
          - '6.1'
          - '5.15'
          - '5.10'
          - '5.4'
          - '4.19'
          - '4.14'
          - '4.9'
          - '4.4'
      feature_base:
        description: '基础系统配置 (含 Intel/AMD 平台与固态驱动)'
        type: boolean
        default: true
      feature_usb_gadget:
        description: 'USB Gadget / dwc3 / 大容量存储(UMS)'
        type: boolean
        default: true
      feature_usb_serial:
        description: 'USB 转串口 (CH340/CH341, CH343P)'
        type: boolean
        default: true
      feature_usbip:
        description: 'USB/IP 支持 (内核 + 用户空间工具)'
        type: boolean
        default: true
      feature_lxc:
        description: 'LXC 容器完整支持'
        type: boolean
        default: true
      feature_vhd:
        description: 'VHD 启动支持 (loop + NTFS3)'
        type: boolean
        default: true
      feature_virt:
        description: '虚拟化与 QEMU 支持 (KVM / VFIO / Virtio / 9p)'
        type: boolean
        default: true
      feature_docker:
        description: 'Docker / Podman 完整支持'
        type: boolean
        default: true
      feature_btrfs:
        description: 'Btrfs 文件系统支持 (含 ZSTD 压缩)'
        type: boolean
        default: true
      feature_apple:
        description: 'Apple Mac 设备驱动'
        type: boolean
        default: true
      feature_audio:
        description: '音频支持 (Intel HDA / 杜比 / HDMI / ALSA)'
        type: boolean
        default: true
      feature_enhance:
        description: '内核增强 (KernelSU / Kprobes / Android 容器 / 符号表)'
        type: boolean
        default: true
      feature_xhci:
        description: 'xHCI 主机控制器支持 (USB 3.x 主控)'
        type: boolean
        default: true
      feature_usb3_2:
        description: 'USB 3.2 SuperSpeed 支持'
        type: boolean
        default: true
      feature_uvc:
        description: 'USB Video Class 摄像头支持'
        type: boolean
        default: true
      feature_amd_platform:
        description: 'AMD 主板平台驱动 (USB, RAID, SATA, NVMe, 声卡等)'
        type: boolean
        default: false
      gpu_support:
        description: '显卡支持'
        required: true
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'nvidia'
          - 'amd'
      wired_net:
        description: '有线网卡支持'
        required: true
        type: choice
        default: 'both'
        options:
          - 'none'
          - 'intel'
          - 'realtek'
          - 'both'
      wireless_bt:
        description: '无线网卡与蓝牙支持'
        required: true
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'intel'
          - 'broadcom'
          - 'both'
      extra_peripherals:
        description: '扩展外设集 (指纹/红外/触摸屏/传感器/GPS/4G/相机/杂项USB)'
        type: boolean
        default: false

env:
  KERNEL_VERSION: ${{ github.event.inputs.kernel_version || '7.0' }}
  ARCH: x86_64
  ARTIFACT_NAME: Kernel-Linux-${{ github.event.inputs.kernel_version || '7.0' }}-x86_64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc dwarves rsync cpio wget xz-utils git fakeroot dpkg-dev \
            libtool autoconf automake pkg-config libglib2.0-dev libudev-dev \
            libusb-1.0-0-dev libxml2-dev \
            debhelper libdw-dev

      - name: 打印编译环境信息
        run: |
          echo "=== 编译环境硬件信息 ==="
          lscpu | grep -E "Model name|Architecture|CPU\(s\)|Thread|Core|Socket" || true
          echo "内存:"
          free -h
          echo "系统:"
          lsb_release -a 2>/dev/null || cat /etc/os-release
          echo "GCC 版本:"
          gcc --version

      - name: 缓存 Linux 源码压缩包
        id: cache-src-tarball
        uses: actions/cache@v4
        with:
          path: linux.tar.gz
          key: linux-kernel-src-${{ env.KERNEL_VERSION }}

      - name: 下载 Linux 内核源码 (若未缓存)
        if: steps.cache-src-tarball.outputs.cache-hit != 'true'
        run: |
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          echo "下载 Linux ${KERNEL_VERSION} 源码..."
          wget -q "https://github.com/torvalds/linux/archive/refs/tags/v${KERNEL_VERSION}.tar.gz" -O linux.tar.gz

      - name: 解压源码并设置工作目录
        run: |
          tar -xzf linux.tar.gz
          mv linux-* linux-src
          echo "KERNEL_SRC=$(pwd)/linux-src" >> $GITHUB_ENV

      - name: 生成主线默认配置
        run: |
          cd $KERNEL_SRC
          make defconfig

      - name: 创建自定义内核配置片段 (整合版)
        run: |
          cd $KERNEL_SRC
          cat > custom-features.cfg << 'EOF'
          # 基础系统配置（含 Intel/AMD 平台 RAID/SATA/NVMe/电源管理/固态优化）
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_SYSVIPC_COMPAT=y
          CONFIG_EPOLL=y
          CONFIG_EVENTFD=y
          CONFIG_SIGNALFD=y
          CONFIG_INOTIFY_USER=y
          CONFIG_SHMEM=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_USB_SUPPORT=y
          CONFIG_PCI=y
          CONFIG_USB_COMMON=y
          CONFIG_BLK_DEV_SD=y
          CONFIG_ATA=y
          CONFIG_SATA_AHCI=y
          CONFIG_SATA_MOBILE_LPM_POLICY=0
          CONFIG_ATA_SFF=y
          CONFIG_ATA_BMDMA=y
          CONFIG_PATA_OLDPIIX=y
          CONFIG_PATA_SCH=y
          CONFIG_NVME_CORE=y
          CONFIG_BLK_DEV_NVME=y
          CONFIG_NVME_MULTIPATH=y
          CONFIG_INTEL_IDMA64=y
          CONFIG_INTEL_IOMMU=y
          CONFIG_INTEL_IOMMU_DEFAULT_ON=y
          CONFIG_INTEL_POWERCLAMP=y
          CONFIG_INTEL_RAPL=y
          CONFIG_INTEL_SPEED_SELECT_INTERFACE=y
          CONFIG_INTEL_UNCORE_FREQ_CONTROL=y
          CONFIG_PM=y
          CONFIG_ACPI=y
          CONFIG_CPU_FREQ=y
          CONFIG_CPU_IDLE=y
          CONFIG_I2C_I801=y
          CONFIG_GPIO_SCH=y
          CONFIG_PINCTRL=y
          CONFIG_PINCTRL_INTEL=y
          CONFIG_WATCHDOG=y
          # 常见固态硬盘优化与驱动
          CONFIG_NVME_HWMON=y
          CONFIG_NVME_TCP=y
          CONFIG_NVME_TARGET=y
          CONFIG_BLK_DEV_SD=y
          CONFIG_SCSI=y
          CONFIG_BLK_DEV_SR=y
          CONFIG_CHR_DEV_SG=y
          CONFIG_SCSI_MQ_DEFAULT=y
          CONFIG_SCSI_VIRTIO=y
          CONFIG_ATA_VERBOSE_ERROR=y
          CONFIG_SATA_AHCI=y
          CONFIG_SATA_MOBILE_LPM_POLICY=0
          CONFIG_SATA_AHCI_PLATFORM=y
          CONFIG_AHCI_CEVA=y
          CONFIG_AHCI_QORIQ=y
          CONFIG_SATA_INIC162X=y
          CONFIG_SATA_ACARD_AHCI=y
          CONFIG_SATA_SIL24=y
          CONFIG_PATA_AMD=y
          CONFIG_PATA_MPIIX=y
          CONFIG_PATA_OLDPIIX=y
          CONFIG_PATA_SCH=y
          CONFIG_PATA_IT821X=y
          CONFIG_PATA_JMICRON=y
          CONFIG_PATA_MARVELL=y
          CONFIG_PATA_NETCELL=y
          CONFIG_PATA_NINJA32=y
          CONFIG_PATA_NS87415=y
          CONFIG_PATA_OPTI=y
          CONFIG_PATA_PLATFORM=y
          CONFIG_PATA_RZ1000=y
          CONFIG_PATA_SERVERWORKS=y
          CONFIG_PATA_SIL680=y
          CONFIG_PATA_SIS=y
          CONFIG_PATA_TOSHIBA=y
          CONFIG_PATA_TRIFLEX=y
          CONFIG_PATA_VIA=y
          CONFIG_PATA_WINBOND=y
          # 锐炬独显支持 (i915 已默认，补充特定固件)
          CONFIG_DRM_I915=y
          CONFIG_DRM_I915_FORCE_PROBE="*"
          CONFIG_DRM_I915_CAPTURE_ERROR=y
          CONFIG_DRM_I915_COMPRESS_ERROR=y
          CONFIG_DRM_I915_USERPTR=y
          CONFIG_DRM_I915_GVT=y
          CONFIG_DRM_I915_GVT_KVMGT=y
          CONFIG_DRM_I915_PXP=y
          CONFIG_DRM_I915_DEBUG_RUNTIME_PM=n
          EOF

          # USB Gadget / dwc3 + 大容量存储 (host 侧)
          if [[ "${{ github.event.inputs.feature_usb_gadget }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_DWC3=y
          CONFIG_USB_DWC3_HOST=y
          CONFIG_USB_DWC3_GADGET=y
          CONFIG_USB_DWC3_DUAL_ROLE=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_F_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_SERIAL=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_F_LB_SS=y
          CONFIG_USB_MASS_STORAGE=y
          # 大容量存储 host 侧驱动
          CONFIG_USB_STORAGE=y
          CONFIG_USB_UAS=y
          EOF
          fi

          # USB 转串口 (CH343)
          if [[ "${{ github.event.inputs.feature_usb_serial }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_GENERIC=y
          CONFIG_USB_SERIAL_CH341=y
          CONFIG_USB_SERIAL_CH343=m
          EOF
            if [ ! -f drivers/usb/serial/ch343.c ]; then
              wget -q --tries=3 --timeout=10 https://raw.githubusercontent.com/WCHSoftGroup/ch343ser_linux/master/driver/ch343.c -O drivers/usb/serial/ch343.c || echo "警告: 下载 ch343.c 失败"
              wget -q --tries=3 --timeout=10 https://raw.githubusercontent.com/WCHSoftGroup/ch343ser_linux/master/driver/ch343.h -O drivers/usb/serial/ch343.h || echo "警告: 下载 ch343.h 失败"
            fi
            if ! grep -q "config USB_SERIAL_CH343" drivers/usb/serial/Kconfig; then
              echo "" >> drivers/usb/serial/Kconfig
              echo "config USB_SERIAL_CH343" >> drivers/usb/serial/Kconfig
              echo "	tristate \"CH343 USB serial driver\"" >> drivers/usb/serial/Kconfig
              echo "	help" >> drivers/usb/serial/Kconfig
              echo "	  Say Y here to include support for CH343 USB to serial adapter." >> drivers/usb/serial/Kconfig
            fi
            if ! grep -q "obj-\$(CONFIG_USB_SERIAL_CH343)" drivers/usb/serial/Makefile; then
              echo "obj-\$(CONFIG_USB_SERIAL_CH343) += ch343.o" >> drivers/usb/serial/Makefile
            fi
          fi

          # USB/IP
          if [[ "${{ github.event.inputs.feature_usbip }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USBIP_CORE=y
          CONFIG_USBIP_VHCI_HCD=y
          CONFIG_USBIP_HOST=y
          CONFIG_USBIP_VHCI_HC_PORTS=8
          EOF
          fi

          # LXC 容器
          if [[ "${{ github.event.inputs.feature_lxc }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_NAMESPACES=y
          CONFIG_CGROUPS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_BLK_CGROUP=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CGROUP_NET_CLASSID=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_RT_GROUP_SCHED=y
          CONFIG_CHECKPOINT_RESTORE=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          EOF
          fi

          # VHD 启动
          if [[ "${{ github.event.inputs.feature_vhd }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_BLK_DEV_LOOP=y
          CONFIG_NTFS3_FS=y
          CONFIG_NTFS3_LZX_XPRESS=y
          CONFIG_NTFS_FS=n
          EOF
          fi

          # 虚拟化与 QEMU (合并原 KVM+VFIO+QEMU)
          if [[ "${{ github.event.inputs.feature_virt }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_KVM=y
          CONFIG_KVM_INTEL=y
          CONFIG_VFIO=y
          CONFIG_VFIO_PCI=y
          CONFIG_VFIO_IOMMU_TYPE1=y
          CONFIG_VFIO_MDEV=y
          CONFIG_DRM_I915_GVT=y
          CONFIG_DRM_I915_GVT_KVMGT=y
          CONFIG_VIRTIO_PCI=y
          CONFIG_VIRTIO_BALLOON=y
          CONFIG_VIRTIO_BLK=y
          CONFIG_VIRTIO_NET=y
          CONFIG_VIRTIO_CONSOLE=y
          CONFIG_VIRTIO_FS=y
          CONFIG_VIRTIO_GPU=y
          CONFIG_VIRTIO_INPUT=y
          CONFIG_VIRTIO_MMIO=y
          CONFIG_VIRTIO_PMEM=y
          CONFIG_NET_9P=y
          CONFIG_NET_9P_VIRTIO=y
          CONFIG_9P_FS=y
          CONFIG_9P_FS_POSIX_ACL=y
          CONFIG_9P_FS_SECURITY=y
          CONFIG_SCSI_VIRTIO=y
          EOF
          fi

          # Docker / Podman
          if [[ "${{ github.event.inputs.feature_docker }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_OVERLAY_FS=m
          CONFIG_FUSE_FS=m
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_TUN=m
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
          CONFIG_IP_NF_FILTER=m
          CONFIG_IP_NF_NAT=m
          CONFIG_CGROUP_BPF=y
          EOF
          fi

          # Btrfs (含 ZSTD 压缩)
          if [[ "${{ github.event.inputs.feature_btrfs }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_BTRFS_FS=m
          CONFIG_BTRFS_FS_POSIX_ACL=y
          CONFIG_ZSTD_COMPRESS=y
          CONFIG_ZSTD_DECOMPRESS=y
          EOF
          fi

          # RTL8XXXU (默认开启，不再作为输入)
          cat >> custom-features.cfg << 'EOF'
          CONFIG_RTL8XXXU=m
          CONFIG_RTL8XXXU_UNTESTED=y
          EOF

          # Apple 驱动
          if [[ "${{ github.event.inputs.feature_apple }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB4=m
          CONFIG_MOUSE_BCM5974=y
          CONFIG_HID_MAGICMOUSE=y
          CONFIG_MACINTOSH_DRIVERS=y
          CONFIG_HID_APPLE=y
          CONFIG_KEYBOARD_APPLESPI=y
          CONFIG_SENSORS_APPLESMC=y
          CONFIG_MEDIA_SUPPORT=y
          CONFIG_MEDIA_CAMERA_SUPPORT=y
          CONFIG_MEDIA_CONTROLLER=y
          CONFIG_VIDEO_DEV=y
          CONFIG_VIDEO_V4L2=y
          CONFIG_VIDEOBUF2_CORE=y
          CONFIG_VIDEOBUF2_V4L2=y
          CONFIG_VIDEOBUF2_MEMOPS=y
          CONFIG_VIDEOBUF2_VMALLOC=y
          CONFIG_VIDEOBUF2_DMA_SG=y
          CONFIG_V4L_PLATFORM_DRIVERS=y
          CONFIG_V4L_MEM2MEM_DRIVERS=y
          EOF
          fi

          # 音频支持
          if [[ "${{ github.event.inputs.feature_audio }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_SOUND=y
          CONFIG_SND=y
          CONFIG_SND_HDA_INTEL=y
          CONFIG_SND_HDA_CODEC_HDMI=y
          CONFIG_SND_HDA_CODEC_DOLBY=y
          CONFIG_SND_HDA_CODEC_CIRRUS=y
          CONFIG_SND_HDA_CODEC_CS8409=y
          CONFIG_SND_HDA_CODEC_REALTEK=y
          CONFIG_SND_HDA_CODEC_ANALOG=y
          CONFIG_SND_HDA_CODEC_SIGMATEL=y
          CONFIG_SND_HDA_CODEC_VIA=y
          CONFIG_SND_HDA_CODEC_CA0132=y
          CONFIG_SND_HDA_CODEC_CMEDIA=y
          CONFIG_SND_HDA_CODEC_SI3054=y
          CONFIG_SND_HDA_GENERIC=y
          CONFIG_SND_HDA_POWER_SAVE_DEFAULT=1
          CONFIG_SND_HDA_CORE=y
          CONFIG_SND_HDA_PREALLOC_SIZE=64
          CONFIG_SND_USB_AUDIO=y
          CONFIG_SND_SOC=y
          CONFIG_SND_SOC_INTEL_SST=y
          CONFIG_SND_SOC_INTEL_SKYLAKE=y
          CONFIG_SND_SOC_INTEL_KBL=y
          CONFIG_SND_SOC_INTEL_CNL=y
          CONFIG_SND_SOC_INTEL_ICL=y
          CONFIG_SND_SOC_INTEL_TGL=y
          CONFIG_SND_SOC_INTEL_EHL=y
          CONFIG_SND_SOC_AMD_ACP=y
          CONFIG_SND_SOC_AMD_ACP3x=y
          CONFIG_SND_SOC_AMD_RENOIR=y
          EOF
          fi

          # 内核增强 (合并 KernelSU + Android 容器 + 符号表)
          if [[ "${{ github.event.inputs.feature_enhance }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_DEBUG_FS=y
          CONFIG_STAGING=y
          CONFIG_ASHMEM=y
          CONFIG_ANDROID=y
          CONFIG_ANDROID_BINDER_IPC=y
          CONFIG_ANDROID_BINDERFS=y
          CONFIG_ION=y
          CONFIG_ION_SYSTEM_HEAP=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF
          fi

          # xHCI
          if [[ "${{ github.event.inputs.feature_xhci }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_XHCI_HCD=y
          CONFIG_USB_XHCI_PCI=y
          CONFIG_USB_XHCI_PLATFORM=y
          EOF
          fi

          # USB 3.2
          if [[ "${{ github.event.inputs.feature_usb3_2 }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_SUPERSPEED=y
          CONFIG_USB_SUPERSPEED_PLUS=y
          CONFIG_USB_DEFAULT_PERSIST=y
          EOF
          fi

          # UVC 摄像头 (独立)
          if [[ "${{ github.event.inputs.feature_uvc }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_MEDIA_SUPPORT=y
          CONFIG_MEDIA_CAMERA_SUPPORT=y
          CONFIG_MEDIA_CONTROLLER=y
          CONFIG_VIDEO_DEV=y
          CONFIG_VIDEO_V4L2=y
          CONFIG_USB_VIDEO_CLASS=y
          CONFIG_VIDEOBUF2_CORE=y
          CONFIG_VIDEOBUF2_V4L2=y
          CONFIG_VIDEOBUF2_MEMOPS=y
          CONFIG_VIDEOBUF2_VMALLOC=y
          EOF
          fi

          # 显卡支持
          if [[ "${{ github.event.inputs.gpu_support }}" == "nvidia" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_DRM_NOUVEAU=y
          CONFIG_NOUVEAU_DEBUG=0
          CONFIG_NOUVEAU_DEBUG_DEFAULT=0
          CONFIG_DRM_NOUVEAU_BACKLIGHT=y
          EOF
          elif [[ "${{ github.event.inputs.gpu_support }}" == "amd" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_DRM_AMDGPU=y
          CONFIG_DRM_AMDGPU_SI=y
          CONFIG_DRM_AMDGPU_CIK=y
          CONFIG_DRM_AMDGPU_USERPTR=y
          CONFIG_HSA_AMD=y
          EOF
          fi

          # 有线网卡
          case "${{ github.event.inputs.wired_net }}" in
            intel)
              cat >> custom-features.cfg << 'EOF'
          CONFIG_E1000=y
          CONFIG_E1000E=y
          CONFIG_IGB=y
          CONFIG_IGBVF=y
          CONFIG_IXGB=y
          CONFIG_IXGBE=y
          CONFIG_IXGBEVF=y
          CONFIG_I40E=y
          CONFIG_ICE=y
          EOF
              ;;
            realtek)
              cat >> custom-features.cfg << 'EOF'
          CONFIG_R8169=y
          EOF
              ;;
            both)
              cat >> custom-features.cfg << 'EOF'
          CONFIG_E1000=y
          CONFIG_E1000E=y
          CONFIG_IGB=y
          CONFIG_IGBVF=y
          CONFIG_IXGB=y
          CONFIG_IXGBE=y
          CONFIG_IXGBEVF=y
          CONFIG_I40E=y
          CONFIG_ICE=y
          CONFIG_R8169=y
          EOF
              ;;
          esac

          # 无线与蓝牙
          case "${{ github.event.inputs.wireless_bt }}" in
            intel)
              cat >> custom-features.cfg << 'EOF'
          CONFIG_WLAN=y
          CONFIG_WLAN_VENDOR_INTEL=y
          CONFIG_IWLWIFI=y
          CONFIG_IWLDVM=y
          CONFIG_IWLMVM=y
          CONFIG_IWLWIFI_OPMODE_MODULAR=y
          CONFIG_BT=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_LE=y
          CONFIG_BT_INTEL=y
          CONFIG_BT_HCIBTUSB=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_INTEL=y
          EOF
              ;;
            broadcom)
              cat >> custom-features.cfg << 'EOF'
          CONFIG_WLAN_VENDOR_BROADCOM=y
          CONFIG_B43=y
          CONFIG_B43_PCI_AUTOSELECT=y
          CONFIG_B43_PCICORE_AUTOSELECT=y
          CONFIG_B43_PHY_N=y
          CONFIG_B43_PHY_LP=y
          CONFIG_B43_PHY_HT=y
          CONFIG_BRCMFMAC=y
          CONFIG_BT=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_LE=y
          CONFIG_BT_BCM=y
          CONFIG_BT_HCIBTUSB=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_BCM=y
          EOF
              ;;
            both)
              cat >> custom-features.cfg << 'EOF'
          CONFIG_WLAN=y
          CONFIG_WLAN_VENDOR_INTEL=y
          CONFIG_IWLWIFI=y
          CONFIG_IWLDVM=y
          CONFIG_IWLMVM=y
          CONFIG_IWLWIFI_OPMODE_MODULAR=y
          CONFIG_WLAN_VENDOR_BROADCOM=y
          CONFIG_B43=y
          CONFIG_B43_PCI_AUTOSELECT=y
          CONFIG_B43_PCICORE_AUTOSELECT=y
          CONFIG_B43_PHY_N=y
          CONFIG_B43_PHY_LP=y
          CONFIG_B43_PHY_HT=y
          CONFIG_BRCMFMAC=y
          CONFIG_BT=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_LE=y
          CONFIG_BT_INTEL=y
          CONFIG_BT_BCM=y
          CONFIG_BT_HCIBTUSB=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_INTEL=y
          CONFIG_BT_HCIUART_BCM=y
          EOF
              ;;
          esac

          # AMD 平台
          if [[ "${{ github.event.inputs.feature_amd_platform }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_PCI=y
          CONFIG_USB_EHCI_HCD=y
          CONFIG_USB_OHCI_HCD=y
          CONFIG_USB_UHCI_HCD=y
          CONFIG_AMD_IOMMU=y
          CONFIG_AMD_IOMMU_V2=y
          CONFIG_AMD_NB=y
          CONFIG_AMD_XGBE=y
          CONFIG_AMD_PMC=y
          CONFIG_SATA_AHCI=y
          CONFIG_PATA_AMD=y
          CONFIG_NVME_CORE=y
          CONFIG_BLK_DEV_NVME=y
          CONFIG_SENSORS_K8TEMP=y
          CONFIG_SENSORS_K10TEMP=y
          CONFIG_SENSORS_FAM15H_POWER=y
          CONFIG_SENSORS_AMD_ENERGY=y
          CONFIG_SND_HDA_INTEL=y
          CONFIG_SND_HDA_CODEC_REALTEK=y
          CONFIG_SND_HDA_CODEC_HDMI=y
          CONFIG_SND_SOC_AMD_ACP=y
          CONFIG_SND_SOC_AMD_ACP3x=y
          CONFIG_SND_SOC_AMD_RENOIR=y
          CONFIG_SND_SOC_AMD_YC=y
          EOF
          fi

          # 打印机 (默认开启)
          cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_PRINTER=y
          EOF

          # 扩展外设集
          if [[ "${{ github.event.inputs.extra_peripherals }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_FINGERPRINT=y
          CONFIG_IR_CORE=y
          CONFIG_IR_RC5_DECODER=y
          CONFIG_IR_RC6_DECODER=y
          CONFIG_IR_JVC_DECODER=y
          CONFIG_IR_SONY_DECODER=y
          CONFIG_RC_CORE=y
          CONFIG_IRDA=y
          CONFIG_VIDEO_OV2640=m
          CONFIG_VIDEO_OV5640=m
          CONFIG_VIDEO_OV7670=m
          CONFIG_TOUCHSCREEN=y
          CONFIG_TOUCHSCREEN_USB_COMPOSITE=y
          CONFIG_HID_MULTITOUCH=y
          CONFIG_IIO=y
          CONFIG_HID_SENSOR_ACCEL_3D=y
          CONFIG_HID_SENSOR_ALS=y
          CONFIG_HID_SENSOR_GYRO_3D=y
          CONFIG_HID_SENSOR_MAGNETOMETER_3D=y
          CONFIG_HID_SENSOR_PROX=y
          CONFIG_GNSS=y
          CONFIG_GNSS_SIRF_SERIAL=y
          CONFIG_GNSS_UBX_SERIAL=y
          CONFIG_USB_NET_CDC_MBIM=y
          CONFIG_USB_NET_QMI_WWAN=y
          CONFIG_USB_SERIAL_OPTION=y
          CONFIG_USB_SERIAL_QUALCOMM=y
          CONFIG_WWAN=y
          CONFIG_USB_ACM=y
          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_FTDI_SIO=y
          CONFIG_USB_SERIAL_CP210X=y
          CONFIG_USB_PTP=y
          CONFIG_USB_MDC800=y
          CONFIG_USB_MICROTEK=y
          CONFIG_USB_GSPCA=y
          CONFIG_USB_EMI26=m
          CONFIG_USB_SISUSBVGA=m
          CONFIG_USB_IOWARRIOR=m
          CONFIG_USB_ISIGHTFW=m
          EOF
          fi

      - name: 应用自定义配置
        run: |
          cd $KERNEL_SRC
          if [ -f scripts/kconfig/merge_config.sh ]; then
            echo "使用 merge_config.sh 合并配置..."
            scripts/kconfig/merge_config.sh -m .config custom-features.cfg
          else
            echo "merge_config.sh 不存在，使用手动安全追加..."
            grep -v -F -f <(cut -d= -f1 custom-features.cfg) .config > .config.tmp 2>/dev/null || cp .config .config.tmp
            cat custom-features.cfg >> .config.tmp
            mv .config.tmp .config
          fi

          if make help 2>/dev/null | head -n 50 | grep -q olddefconfig; then
            make olddefconfig
          else
            yes "" | make oldconfig
          fi

          if [ -f scripts/config ]; then
            echo "使用 scripts/config 强制启用关键选项..."
            ./scripts/config --enable CONFIG_USB_SUPPORT
            ./scripts/config --enable CONFIG_PCI
            if [[ "${{ github.event.inputs.feature_usb_gadget }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_GADGET
              ./scripts/config --enable CONFIG_USB_STORAGE
            fi
            if [[ "${{ github.event.inputs.feature_virt }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_KVM
              ./scripts/config --enable CONFIG_KVM_INTEL
            fi
            if [[ "${{ github.event.inputs.feature_docker }}" == "true" ]]; then
              ./scripts/config --module CONFIG_OVERLAY_FS
            fi
            if [[ "${{ github.event.inputs.feature_xhci }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_XHCI_HCD
            fi
            if [[ "${{ github.event.inputs.feature_usb3_2 }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_SUPERSPEED
            fi
            if [[ "${{ github.event.inputs.feature_uvc }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_VIDEO_CLASS
            fi
            if [[ "${{ github.event.inputs.gpu_support }}" == "nvidia" ]]; then
              ./scripts/config --enable CONFIG_DRM_NOUVEAU
            elif [[ "${{ github.event.inputs.gpu_support }}" == "amd" ]]; then
              ./scripts/config --enable CONFIG_DRM_AMDGPU
            fi
            if [[ "${{ github.event.inputs.wired_net }}" == "intel" || "${{ github.event.inputs.wired_net }}" == "both" ]]; then
              ./scripts/config --enable CONFIG_E1000E
            fi
            if [[ "${{ github.event.inputs.wired_net }}" == "realtek" || "${{ github.event.inputs.wired_net }}" == "both" ]]; then
              ./scripts/config --enable CONFIG_R8169
            fi
            if [[ "${{ github.event.inputs.wireless_bt }}" != "none" ]]; then
              ./scripts/config --enable CONFIG_BT
            fi
            if [[ "${{ github.event.inputs.feature_amd_platform }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_AMD_IOMMU
            fi
            # 默认开启项
            ./scripts/config --enable CONFIG_USB_PRINTER

            if make help 2>/dev/null | head -n 50 | grep -q olddefconfig; then
              make olddefconfig
            else
              yes "" | make oldconfig
            fi
          fi

      - name: 显示关键配置状态
        run: |
          cd $KERNEL_SRC
          echo "=== 已启用的配置项 (部分) ==="
          grep -E "CONFIG_USB_VIDEO_CLASS|CONFIG_ZSTD_COMPRESS|CONFIG_USB_STORAGE|CONFIG_USB_PRINTER|CONFIG_DRM_NOUVEAU|CONFIG_DRM_AMDGPU|CONFIG_E1000E|CONFIG_R8169|CONFIG_IWLWIFI|CONFIG_BRCMFMAC|CONFIG_BT|CONFIG_AMD_IOMMU|CONFIG_KVM|CONFIG_VIRTIO" .config || true

      - name: 编译内核 (生成二进制 deb 包)
        run: |
          cd $KERNEL_SRC

          # 修复旧内核（如 4.4）PIC 错误和源码包检查
          export KBUILD_CFLAGS="-fno-pie"
          export KCFLAGS="-fno-pie -Wno-attributes -Wno-error"
          export KDEB_SOURCECHECK=false

          # 修复权限问题：确保 scripts 下的可执行文件有执行权限
          chmod +x scripts/basic/fixdep
          chmod +x scripts/kconfig/conf
          chmod +x scripts/mod/modpost 2>/dev/null || true
          chmod +x scripts/sorttable 2>/dev/null || true
          chmod +x scripts/asn1_compiler 2>/dev/null || true
          find scripts -name "*.sh" -exec chmod +x {} \;

          if make help | grep -q "bindeb-pkg"; then
            echo "使用 bindeb-pkg 构建"
            make -j$(nproc) bindeb-pkg LOCALVERSION=-${KERNEL_VERSION}
          else
            echo "使用 deb-pkg 构建"
            make -j$(nproc) deb-pkg LOCALVERSION=-${KERNEL_VERSION}
          fi

      - name: 编译 USB/IP 工具
        if: github.event.inputs.feature_usbip == 'true'
        run: |
          cd $KERNEL_SRC/tools/usb/usbip
          echo "=== 开始编译 USB/IP 工具 ==="
          ./autogen.sh
          CFLAGS="-Wno-error" ./configure --prefix=/usr/local
          make -j$(nproc)
          mkdir -p /tmp/usbip-tools/usr/local/bin
          mkdir -p /tmp/usbip-tools/usr/local/lib
          mkdir -p /tmp/usbip-tools/usr/local/sbin
          make install DESTDIR=/tmp/usbip-tools
          find /tmp/usbip-tools -name "*.so*" -exec cp -P {} /tmp/usbip-tools/usr/local/lib/ \; 2>/dev/null || true
          cat > /tmp/usbip-tools/install.sh << 'EOF'
          #!/bin/bash
          echo "安装 USB/IP 工具..."
          cp -r usr/local/bin/* /usr/local/bin/ 2>/dev/null || true
          cp -r usr/local/sbin/* /usr/local/sbin/ 2>/dev/null || true
          cp -r usr/local/lib/* /usr/local/lib/ 2>/dev/null || true
          ldconfig
          echo "USB/IP 工具安装完成！"
          EOF
          chmod +x /tmp/usbip-tools/install.sh
          cd /tmp
          tar -czf usbip-tools-linux-${KERNEL_VERSION}.tar.gz usbip-tools/
          echo "=== USB/IP 工具打包完成 ==="
          ls -la /tmp/usbip-tools-linux-${KERNEL_VERSION}.tar.gz

      - name: 收集构建产物
        run: |
          mkdir -p artifacts
          cp $KERNEL_SRC/../*.deb artifacts/ 2>/dev/null || true
          cd $KERNEL_SRC
          MODULE_ZIP="$GITHUB_WORKSPACE/artifacts/${ARTIFACT_NAME}-modules.zip"
          find . -name "*.ko" -type f | zip -q -@ "${MODULE_ZIP}"
          find . -name "*.ko" -type f > $GITHUB_WORKSPACE/artifacts/modules-list.txt
          if [ -f /tmp/usbip-tools-linux-${KERNEL_VERSION}.tar.gz ]; then
            cp /tmp/usbip-tools-linux-${KERNEL_VERSION}.tar.gz $GITHUB_WORKSPACE/artifacts/
          fi
          cd $GITHUB_WORKSPACE/artifacts
          cat > RELEASE_INFO.txt << EOF
          内核版本：${KERNEL_VERSION}
          构建时间：$(date)
          GitHub 运行编号：${{ github.run_number }}
          虚拟化与 QEMU：${{ github.event.inputs.feature_virt }}
          内核增强：${{ github.event.inputs.feature_enhance }}
          UVC 摄像头：${{ github.event.inputs.feature_uvc }}
          显卡支持：${{ github.event.inputs.gpu_support }}
          有线网卡：${{ github.event.inputs.wired_net }}
          无线与蓝牙：${{ github.event.inputs.wireless_bt }}
          扩展外设集：${{ github.event.inputs.extra_peripherals }}
          EOF

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/
          retention-days: 7

  release:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 下载 Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-files/

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.KERNEL_VERSION }}-${{ github.run_number }}
          name: Linux ${{ env.KERNEL_VERSION }} 定制内核
          body: |
            ## 📦 Linux ${{ env.KERNEL_VERSION }} 定制内核

            **构建时间：** $(date)
            **GitHub 运行编号：** ${{ github.run_number }}

            ### 🔧 用户选择的功能
            - 基础系统配置 (含 Intel/AMD 平台与固态驱动): ${{ github.event.inputs.feature_base }}
            - USB Gadget / dwc3 / 大容量存储(UMS): ${{ github.event.inputs.feature_usb_gadget }}
            - USB 转串口 (CH340/CH341, CH343P): ${{ github.event.inputs.feature_usb_serial }}
            - USB/IP 支持: ${{ github.event.inputs.feature_usbip }}
            - LXC 容器完整支持: ${{ github.event.inputs.feature_lxc }}
            - VHD 启动支持 (loop + NTFS3): ${{ github.event.inputs.feature_vhd }}
            - 虚拟化与 QEMU 支持 (KVM / VFIO / Virtio / 9p): ${{ github.event.inputs.feature_virt }}
            - Docker / Podman 完整支持: ${{ github.event.inputs.feature_docker }}
            - Btrfs 文件系统支持 (含 ZSTD 压缩): ${{ github.event.inputs.feature_btrfs }}
            - Apple Mac 设备驱动: ${{ github.event.inputs.feature_apple }}
            - 音频支持 (Intel HDA / 杜比 / HDMI / ALSA): ${{ github.event.inputs.feature_audio }}
            - 内核增强 (KernelSU / Kprobes / Android 容器 / 符号表): ${{ github.event.inputs.feature_enhance }}
            - xHCI 主机控制器支持 (USB 3.x 主控): ${{ github.event.inputs.feature_xhci }}
            - USB 3.2 SuperSpeed 支持: ${{ github.event.inputs.feature_usb3_2 }}
            - UVC 摄像头支持: ${{ github.event.inputs.feature_uvc }}
            - AMD 主板平台驱动: ${{ github.event.inputs.feature_amd_platform }}
            - 显卡支持: ${{ github.event.inputs.gpu_support }}
            - 有线网卡支持: ${{ github.event.inputs.wired_net }}
            - 无线网卡与蓝牙支持: ${{ github.event.inputs.wireless_bt }}
            - 扩展外设集 (指纹/红外/触摸屏/传感器/GPS/4G/相机/杂项USB): ${{ github.event.inputs.extra_peripherals }}

            ### ✅ 默认开启的功能
            - RTL8XXXU 无线网卡驱动 (模块)
            - USB 打印机支持
            - Intel 锐炬独显基础支持
            - 常见固态硬盘优化 (NVMe/SATA)

            ### 📁 产物说明
            - **.deb 文件**：内核镜像、头文件、C 库开发包
            - **Kernel-Linux-版本-x86_64-modules.zip**：所有内核模块文件（.ko）
            - **usbip-tools-linux-版本.tar.gz**：USB/IP 用户空间工具（如启用）
            - **RELEASE_INFO.txt**：构建详细信息

            ### 🚀 快速安装
            ```bash
            # 安装内核
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb linux-libc-dev*.deb

            # （可选）提取内核模块
            unzip Kernel-Linux-*-modules.zip -d /lib/modules/

            # （可选）安装 USB/IP 工具
            tar -xzf usbip-tools-linux-*.tar.gz
            cd usbip-tools/
            sudo ./install.sh

            sudo reboot
