          # 人脸识别专用摄像头 (通常 UVC 已覆盖，补充驱动)
          if [[ "${{ github.event.inputs.feature_facecam }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_VIDEO_OV2640=m
          CONFIG_VIDEO_OV5640=m
          CONFIG_VIDEO_OV7670=m
          CONFIG_VIDEO_OV9650=m
          CONFIG_VIDEO_MT9M111=m
          EOF
          fi

          # 触摸屏
          if [[ "${{ github.event.inputs.feature_touchscreen }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_TOUCHSCREEN=y
          CONFIG_TOUCHSCREEN_USB_COMPOSITE=y
          CONFIG_TOUCHSCREEN_USB_EGALAX=y
          CONFIG_TOUCHSCREEN_USB_PANJIT=y
          CONFIG_TOUCHSCREEN_USB_3M=y
          CONFIG_TOUCHSCREEN_USB_ITM=y
          CONFIG_TOUCHSCREEN_USB_ETURBO=y
          CONFIG_TOUCHSCREEN_USB_GUNZE=y
          CONFIG_TOUCHSCREEN_USB_DMC_TSC10=y
          CONFIG_TOUCHSCREEN_USB_IRTOUCH=y
          CONFIG_TOUCHSCREEN_USB_IDEALTEK=y
          CONFIG_TOUCHSCREEN_USB_GENERAL_TOUCH=y
          CONFIG_TOUCHSCREEN_USB_GOTOP=y
          CONFIG_TOUCHSCREEN_USB_JASTEC=y
          CONFIG_TOUCHSCREEN_USB_ELO=y
          CONFIG_TOUCHSCREEN_USB_E2I=y
          CONFIG_TOUCHSCREEN_USB_ZYTRONIC=y
          CONFIG_TOUCHSCREEN_USB_ETT_TC45USB=y
          CONFIG_TOUCHSCREEN_USB_NEXIO=y
          CONFIG_TOUCHSCREEN_USB_EASYTOUCH=y
          CONFIG_HID_MULTITOUCH=y
          EOF
          fi

          # 传感器 (重力感应/加速度/环境光/接近)
          if [[ "${{ github.event.inputs.feature_sensors }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_IIO=y
          CONFIG_IIO_BUFFER=y
          CONFIG_IIO_TRIGGER=y
          CONFIG_HID_SENSOR_ACCEL_3D=y
          CONFIG_HID_SENSOR_ALS=y
          CONFIG_HID_SENSOR_DEVICE_ROTATION=y
          CONFIG_HID_SENSOR_GYRO_3D=y
          CONFIG_HID_SENSOR_MAGNETOMETER_3D=y
          CONFIG_HID_SENSOR_PROX=y
          CONFIG_HID_SENSOR_HUMIDITY=y
          CONFIG_HID_SENSOR_TEMP=y
          CONFIG_IIO_ST_ACCEL=y
          CONFIG_BMA180=y
          CONFIG_MMA8452=y
          EOF
          fi

          # GPS / 北斗
          if [[ "${{ github.event.inputs.feature_gps }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_SERIAL_NAVMAN=y
          CONFIG_USB_SERIAL_GARMIN=y
          CONFIG_USB_SERIAL_IPW=y
          CONFIG_USB_SERIAL_SIERRAWIRELESS=y
          CONFIG_GNSS=y
          CONFIG_GNSS_SIRF_SERIAL=y
          CONFIG_GNSS_UBX_SERIAL=y
          EOF
          fi

          # 移动通信 3G/4G/5G (WWAN)
          if [[ "${{ github.event.inputs.feature_mobile_wwan }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_NET_DRIVERS=y
          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=y
          CONFIG_USB_NET_CDC_NCM=y
          CONFIG_USB_NET_CDC_MBIM=y
          CONFIG_USB_NET_QMI_WWAN=y
          CONFIG_USB_NET_HUAWEI_CDC_NCM=y
          CONFIG_USB_SERIAL_OPTION=y
          CONFIG_USB_SERIAL_QUALCOMM=y
          CONFIG_WWAN=y
          CONFIG_MHI_WWAN_CTRL=y
          CONFIG_MHI_WWAN_MBIM=y
          EOF
          fi

          # 调制解调器 / 传真机
          if [[ "${{ github.event.inputs.feature_modem }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_ACM=y
          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_SIMPLE=y
          CONFIG_USB_SERIAL_PL2303=y
          CONFIG_USB_SERIAL_FTDI_SIO=y
          CONFIG_USB_SERIAL_CP210X=y
          EOF
          fi

          # 打印机 / 扫描仪
          if [[ "${{ github.event.inputs.feature_printer }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_PRINTER=y
          CONFIG_USB_ANNOUNCE_NEW_DEVICES=y
          EOF
          fi

          # 数码相机 (PTP/MTP / 特定品牌驱动)
          if [[ "${{ github.event.inputs.feature_digital_cam }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_MEDIA_SUPPORT=y
          CONFIG_MEDIA_DIGITAL_TV_SUPPORT=y
          CONFIG_USB_PTP=y
          CONFIG_USB_MDC800=y
          CONFIG_USB_MICROTEK=y
          CONFIG_USB_GSPCA=y
          CONFIG_USB_GSPCA_CONEX=y
          CONFIG_USB_GSPCA_ETOMS=y
          CONFIG_USB_GSPCA_FINEPIX=y
          CONFIG_USB_GSPCA_JEILINJ=y
          CONFIG_USB_GSPCA_MARS=y
          CONFIG_USB_GSPCA_MR97310A=y
          CONFIG_USB_GSPCA_OV519=y
          CONFIG_USB_GSPCA_OV534=y
          CONFIG_USB_GSPCA_PAC207=y
          CONFIG_USB_GSPCA_PAC7302=y
          CONFIG_USB_GSPCA_SN9C20X=y
          CONFIG_USB_GSPCA_SONIXB=y
          CONFIG_USB_GSPCA_SONIXJ=y
          CONFIG_USB_GSPCA_SPCA500=y
          CONFIG_USB_GSPCA_SPCA501=y
          CONFIG_USB_GSPCA_SPCA505=y
          CONFIG_USB_GSPCA_SPCA506=y
          CONFIG_USB_GSPCA_SPCA508=y
          CONFIG_USB_GSPCA_SPCA561=y
          CONFIG_USB_GSPCA_STK014=y
          CONFIG_USB_GSPCA_STV0680=y
          CONFIG_USB_GSPCA_SUNPLUS=y
          CONFIG_USB_GSPCA_T613=y
          CONFIG_USB_GSPCA_TV8532=y
          CONFIG_USB_GSPCA_VC032X=y
          CONFIG_USB_GSPCA_ZC3XX=y
          EOF
          fi

          # 其他杂项 USB 设备
          if [[ "${{ github.event.inputs.feature_misc_usb }}" == "true" ]]; then
            cat >> custom-features.cfg << 'EOF'
          CONFIG_USB_EMI26=m
          CONFIG_USB_EMI62=m
          CONFIG_USB_APPLEDISPLAY=m
          CONFIG_USB_SISUSBVGA=m
          CONFIG_USB_LD=m
          CONFIG_USB_TRANCEVIBRATOR=m
          CONFIG_USB_IOWARRIOR=m
          CONFIG_USB_TEST=m
          CONFIG_USB_EHSET_TEST_FIXTURE=m
          CONFIG_USB_ISIGHTFW=m
          CONFIG_USB_YUREX=m
          CONFIG_USB_EZUSB_FX2=m
          CONFIG_USB_HUB_USB251XB=m
          CONFIG_USB_HSIC_USB3503=m
          CONFIG_USB_HSIC_USB4604=m
          CONFIG_USB_LINK_LAYER_TEST=m
          CONFIG_USB_CHAOSKEY=m
          CONFIG_USB_ATM=m
          CONFIG_USB_SPEEDTOUCH=m
          CONFIG_USB_CXACRU=m
          CONFIG_USB_UEAGLEATM=m
          CONFIG_USB_XUSBATM=m
          EOF
          fi

      - name: 应用自定义配置 (修复管道错误，兼容所有内核版本)
        run: |
          cd $KERNEL_SRC
          if [ -f scripts/kconfig/merge_config.sh ]; then
            echo "使用 merge_config.sh 合并配置..."
            scripts/kconfig/merge_config.sh -m .config custom-features.cfg
          else
            echo "merge_config.sh 不存在，使用手动安全追加..."
            grep -v -F -f <(cut -d= -f1 custom-features.cfg) .config > .config.tmp 2>/dev/null || cp .config .config.tmp
            cat custom-features.cfg >> .config.tmp
            mv .config.tmp .config
          fi

          if make help 2>/dev/null | head -n 50 | grep -q olddefconfig; then
            make olddefconfig
          else
            echo "olddefconfig 不支持，使用 yes '' | make oldconfig"
            yes "" | make oldconfig
          fi

          if [ -f scripts/config ]; then
            echo "使用 scripts/config 强制启用关键选项..."
            ./scripts/config --enable CONFIG_USB_SUPPORT
            ./scripts/config --enable CONFIG_PCI
            if [[ "${{ github.event.inputs.feature_usb_gadget }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_GADGET
              ./scripts/config --enable CONFIG_USB_CONFIGFS
            fi
            if [[ "${{ github.event.inputs.feature_kvm_vfio }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_KVM
              ./scripts/config --enable CONFIG_KVM_INTEL
            fi
            if [[ "${{ github.event.inputs.feature_docker }}" == "true" ]]; then
              ./scripts/config --module CONFIG_OVERLAY_FS
            fi
            if [[ "${{ github.event.inputs.feature_xhci }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_XHCI_HCD
            fi
            if [[ "${{ github.event.inputs.feature_usb3_2 }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_SUPERSPEED
            fi
            if [[ "${{ github.event.inputs.feature_nvidia_gpu }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_DRM_NOUVEAU
            fi
            if [[ "${{ github.event.inputs.feature_amd_gpu }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_DRM_AMDGPU
            fi
            if [[ "${{ github.event.inputs.feature_intel_eth }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_E1000E
              ./scripts/config --enable CONFIG_IGB
            fi
            if [[ "${{ github.event.inputs.feature_realtek_eth }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_R8169
            fi
            if [[ "${{ github.event.inputs.feature_intel_wifi }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_IWLWIFI
            fi
            if [[ "${{ github.event.inputs.feature_broadcom_wifi }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_BRCMFMAC
            fi
            if [[ "${{ github.event.inputs.feature_bluetooth }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_BT
            fi
            if [[ "${{ github.event.inputs.feature_amd_platform }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_AMD_IOMMU
            fi
            if [[ "${{ github.event.inputs.feature_uvc }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_VIDEO_CLASS
            fi
            if [[ "${{ github.event.inputs.feature_zstd }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_ZSTD_COMPRESS
            fi
            if [[ "${{ github.event.inputs.feature_usb_mass_storage }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_STORAGE
            fi
            if [[ "${{ github.event.inputs.feature_fingerprint }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_FINGERPRINT
            fi
            if [[ "${{ github.event.inputs.feature_ir }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_IR_CORE
            fi
            if [[ "${{ github.event.inputs.feature_facecam }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_VIDEO_OV2640
            fi
            if [[ "${{ github.event.inputs.feature_touchscreen }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_TOUCHSCREEN
            fi
            if [[ "${{ github.event.inputs.feature_sensors }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_IIO
            fi
            if [[ "${{ github.event.inputs.feature_gps }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_GNSS
            fi
            if [[ "${{ github.event.inputs.feature_mobile_wwan }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_NET_CDC_MBIM
            fi
            if [[ "${{ github.event.inputs.feature_modem }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_ACM
            fi
            if [[ "${{ github.event.inputs.feature_printer }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_PRINTER
            fi
            if [[ "${{ github.event.inputs.feature_digital_cam }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_PTP
            fi
            if [[ "${{ github.event.inputs.feature_misc_usb }}" == "true" ]]; then
              ./scripts/config --enable CONFIG_USB_EMI26
            fi

            if make help 2>/dev/null | head -n 50 | grep -q olddefconfig; then
              make olddefconfig
            else
              yes "" | make oldconfig
            fi
          fi

      - name: 显示关键配置状态 (验证)
        run: |
          cd $KERNEL_SRC
          echo "=== 已启用的配置项 (部分) ==="
          grep -E "CONFIG_USB_VIDEO_CLASS|CONFIG_ZSTD_COMPRESS|CONFIG_USB_STORAGE|CONFIG_FINGERPRINT|CONFIG_IR_CORE|CONFIG_TOUCHSCREEN|CONFIG_IIO|CONFIG_GNSS|CONFIG_USB_NET_CDC_MBIM|CONFIG_USB_PRINTER|CONFIG_USB_PTP|CONFIG_DRM_NOUVEAU|CONFIG_DRM_AMDGPU|CONFIG_E1000E|CONFIG_R8169|CONFIG_IWLWIFI|CONFIG_BRCMFMAC|CONFIG_BT|CONFIG_AMD_IOMMU" .config || true

      - name: 编译内核 (生成二进制 deb 包)
        run: |
          cd $KERNEL_SRC
          export KBUILD_CFLAGS="-fno-pie"
          export KCFLAGS="-fno-pie -Wno-attributes -Wno-error"
          export KDEB_SOURCECHECK=false
          if make help | grep -q "bindeb-pkg"; then
            echo "使用 bindeb-pkg 构建"
            make -j$(nproc) bindeb-pkg LOCALVERSION=-${KERNEL_VERSION}
          else
            echo "使用 deb-pkg 构建"
            make -j$(nproc) deb-pkg LOCALVERSION=-${KERNEL_VERSION}
          fi

      - name: 编译 USB/IP 用户空间工具 (如果启用)
        if: github.event.inputs.feature_usbip == 'true'
        run: |
          cd $KERNEL_SRC/tools/usb/usbip
          echo "=== 开始编译 USB/IP 工具 ==="
          ./autogen.sh
          CFLAGS="-Wno-error" ./configure --prefix=/usr/local
          make -j$(nproc)
          mkdir -p /tmp/usbip-tools/usr/local/bin
          mkdir -p /tmp/usbip-tools/usr/local/lib
          mkdir -p /tmp/usbip-tools/usr/local/sbin
          make install DESTDIR=/tmp/usbip-tools
          find /tmp/usbip-tools -name "*.so*" -exec cp -P {} /tmp/usbip-tools/usr/local/lib/ \; 2>/dev/null || true
          cat > /tmp/usbip-tools/install.sh << 'EOF'
          #!/bin/bash
          echo "安装 USB/IP 工具..."
          cp -r usr/local/bin/* /usr/local/bin/ 2>/dev/null || true
          cp -r usr/local/sbin/* /usr/local/sbin/ 2>/dev/null || true
          cp -r usr/local/lib/* /usr/local/lib/ 2>/dev/null || true
          ldconfig
          echo "USB/IP 工具安装完成！"
          EOF
          chmod +x /tmp/usbip-tools/install.sh
          cd /tmp
          tar -czf usbip-tools-linux-${KERNEL_VERSION}.tar.gz usbip-tools/
          echo "=== USB/IP 工具打包完成 ==="
          ls -la /tmp/usbip-tools-linux-${KERNEL_VERSION}.tar.gz

      - name: 收集构建产物 (分离 deb、内核模块、usbip)
        run: |
          mkdir -p artifacts

          cp $KERNEL_SRC/../*.deb artifacts/ 2>/dev/null || true
          echo "=== 收集到的 deb 包 ==="
          ls -la artifacts/*.deb || echo "未找到 deb 包"

          cd $KERNEL_SRC
          MODULE_ZIP="$GITHUB_WORKSPACE/artifacts/${ARTIFACT_NAME}-modules.zip"
          find . -name "*.ko" -type f | zip -q -@ "${MODULE_ZIP}"
          find . -name "*.ko" -type f > $GITHUB_WORKSPACE/artifacts/modules-list.txt
          echo "内核模块已打包至: ${ARTIFACT_NAME}-modules.zip"

          if [ -f /tmp/usbip-tools-linux-${KERNEL_VERSION}.tar.gz ]; then
            cp /tmp/usbip-tools-linux-${KERNEL_VERSION}.tar.gz $GITHUB_WORKSPACE/artifacts/
            echo "USB/IP 工具已复制到 artifacts"
          else
            echo "警告: USB/IP 工具包未找到，跳过"
          fi

          cd $GITHUB_WORKSPACE/artifacts
          cat > RELEASE_INFO.txt << EOF
          内核版本：${KERNEL_VERSION}
          构建时间：$(date)
          GitHub 运行编号：${{ github.run_number }}

          用户选择的功能：
          - 基础系统配置: ${{ github.event.inputs.feature_base }}
          - USB Gadget/UDC: ${{ github.event.inputs.feature_usb_gadget }}
          - USB 转串口: ${{ github.event.inputs.feature_usb_serial }}
          - USB/IP: ${{ github.event.inputs.feature_usbip }}
          - LXC 容器: ${{ github.event.inputs.feature_lxc }}
          - VHD 启动: ${{ github.event.inputs.feature_vhd }}
          - KVM/VFIO: ${{ github.event.inputs.feature_kvm_vfio }}
          - Docker/Podman: ${{ github.event.inputs.feature_docker }}
          - Btrfs: ${{ github.event.inputs.feature_btrfs }}
          - RTL8XXXU: ${{ github.event.inputs.feature_rtl8xxxu }}
          - Apple 驱动: ${{ github.event.inputs.feature_apple }}
          - 音频支持: ${{ github.event.inputs.feature_audio }}
          - Android 容器: ${{ github.event.inputs.feature_android }}
          - KernelSU 基础: ${{ github.event.inputs.feature_ksu }}
          - xHCI 主机控制器: ${{ github.event.inputs.feature_xhci }}
          - USB 3.2 SuperSpeed: ${{ github.event.inputs.feature_usb3_2 }}
          - QEMU 虚拟化: ${{ github.event.inputs.feature_qemu }}
          - NVIDIA 显卡: ${{ github.event.inputs.feature_nvidia_gpu }}
          - AMD 显卡: ${{ github.event.inputs.feature_amd_gpu }}
          - Intel 有线网卡: ${{ github.event.inputs.feature_intel_eth }}
          - Realtek 有线网卡: ${{ github.event.inputs.feature_realtek_eth }}
          - Intel 无线网卡: ${{ github.event.inputs.feature_intel_wifi }}
          - Broadcom 无线网卡: ${{ github.event.inputs.feature_broadcom_wifi }}
          - 蓝牙支持: ${{ github.event.inputs.feature_bluetooth }}
          - AMD 平台驱动: ${{ github.event.inputs.feature_amd_platform }}
          - UVC 摄像头: ${{ github.event.inputs.feature_uvc }}
          - ZSTD 压缩: ${{ github.event.inputs.feature_zstd }}
          - USB 大容量存储: ${{ github.event.inputs.feature_usb_mass_storage }}
          - 指纹识别: ${{ github.event.inputs.feature_fingerprint }}
          - 红外线设备: ${{ github.event.inputs.feature_ir }}
          - 人脸识别摄像头: ${{ github.event.inputs.feature_facecam }}
          - 触摸屏: ${{ github.event.inputs.feature_touchscreen }}
          - 传感器 (重力/加速度/环境光): ${{ github.event.inputs.feature_sensors }}
          - GPS/北斗: ${{ github.event.inputs.feature_gps }}
          - 移动通信 3G/4G/5G: ${{ github.event.inputs.feature_mobile_wwan }}
          - 调制解调器/传真: ${{ github.event.inputs.feature_modem }}
          - 打印机/扫描仪: ${{ github.event.inputs.feature_printer }}
          - 数码相机驱动: ${{ github.event.inputs.feature_digital_cam }}
          - 其他 USB 设备: ${{ github.event.inputs.feature_misc_usb }}

          产物文件：
          - *.deb                : 内核安装包
          - *-modules.zip        : 内核模块 (.ko)
          - usbip-tools-*.tar.gz : USB/IP 用户空间工具（如启用）
          EOF

      - name: 上传构建产物到临时 Artifact（供 Release 使用）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/
          retention-days: 7

  release:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 下载 Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-files/

      - name: 列出待发布文件
        run: |
          echo "=== release-files 目录内容 ==="
          ls -la release-files/

      - name: 创建 GitHub Release 并分别上传文件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.KERNEL_VERSION }}-${{ github.run_number }}
          name: Linux ${{ env.KERNEL_VERSION }} 定制内核
          body: |
            ## 📦 Linux ${{ env.KERNEL_VERSION }} 定制内核

            **构建时间：** $(date)
            **用户选择的功能：**
            - 基础系统配置: ${{ github.event.inputs.feature_base }}
            - USB Gadget/UDC: ${{ github.event.inputs.feature_usb_gadget }}
            - USB 转串口: ${{ github.event.inputs.feature_usb_serial }}
            - USB/IP: ${{ github.event.inputs.feature_usbip }}
            - LXC 容器: ${{ github.event.inputs.feature_lxc }}
            - VHD 启动: ${{ github.event.inputs.feature_vhd }}
            - KVM/VFIO: ${{ github.event.inputs.feature_kvm_vfio }}
            - Docker/Podman: ${{ github.event.inputs.feature_docker }}
            - Btrfs: ${{ github.event.inputs.feature_btrfs }}
            - RTL8XXXU: ${{ github.event.inputs.feature_rtl8xxxu }}
            - Apple 驱动: ${{ github.event.inputs.feature_apple }}
            - 音频支持: ${{ github.event.inputs.feature_audio }}
            - Android 容器: ${{ github.event.inputs.feature_android }}
            - KernelSU 基础: ${{ github.event.inputs.feature_ksu }}
            - xHCI 主机控制器: ${{ github.event.inputs.feature_xhci }}
            - USB 3.2 SuperSpeed: ${{ github.event.inputs.feature_usb3_2 }}
            - QEMU 虚拟化: ${{ github.event.inputs.feature_qemu }}
            - NVIDIA 显卡: ${{ github.event.inputs.feature_nvidia_gpu }}
            - AMD 显卡: ${{ github.event.inputs.feature_amd_gpu }}
            - Intel 有线网卡: ${{ github.event.inputs.feature_intel_eth }}
            - Realtek 有线网卡: ${{ github.event.inputs.feature_realtek_eth }}
            - Intel 无线网卡: ${{ github.event.inputs.feature_intel_wifi }}
            - Broadcom 无线网卡: ${{ github.event.inputs.feature_broadcom_wifi }}
            - 蓝牙支持: ${{ github.event.inputs.feature_bluetooth }}
            - AMD 平台驱动: ${{ github.event.inputs.feature_amd_platform }}
            - UVC 摄像头: ${{ github.event.inputs.feature_uvc }}
            - ZSTD 压缩: ${{ github.event.inputs.feature_zstd }}
            - USB 大容量存储: ${{ github.event.inputs.feature_usb_mass_storage }}
            - 指纹识别: ${{ github.event.inputs.feature_fingerprint }}
            - 红外线设备: ${{ github.event.inputs.feature_ir }}
            - 人脸识别摄像头: ${{ github.event.inputs.feature_facecam }}
            - 触摸屏: ${{ github.event.inputs.feature_touchscreen }}
            - 传感器 (重力/加速度/环境光): ${{ github.event.inputs.feature_sensors }}
            - GPS/北斗: ${{ github.event.inputs.feature_gps }}
            - 移动通信 3G/4G/5G: ${{ github.event.inputs.feature_mobile_wwan }}
            - 调制解调器/传真: ${{ github.event.inputs.feature_modem }}
            - 打印机/扫描仪: ${{ github.event.inputs.feature_printer }}
            - 数码相机驱动: ${{ github.event.inputs.feature_digital_cam }}
            - 其他 USB 设备: ${{ github.event.inputs.feature_misc_usb }}

            ### 📁 产物说明
            - **.deb 文件**：内核镜像、头文件、C 库开发包
            - **Kernel-Linux-版本-x86_64-modules.zip**：所有内核模块文件（.ko）
            - **usbip-tools-linux-版本.tar.gz**：USB/IP 用户空间工具（如启用）
            - **RELEASE_INFO.txt**：构建详细信息

            ### 🚀 快速安装
            ```bash
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb linux-libc-dev*.deb
            unzip Kernel-Linux-*-modules.zip -d /lib/modules/
            tar -xzf usbip-tools-linux-*.tar.gz && cd usbip-tools/ && sudo ./install.sh
            sudo reboot
          files: |
            release-files/*.deb
            release-files/*-modules.zip
            release-files/usbip-tools-*.tar.gz
            release-files/RELEASE_INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
